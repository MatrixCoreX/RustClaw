schema_version = 2

[package]
name = "media_download"
version = "0.1.0"
description = "Download public videos and images from Douyin, Kuaishou, Xiaohongshu, TikTok, and YouTube; resolve direct media URLs, transcribe local video or audio, OCR local images, and prepare videos for X through structured actions."
protocol = "agent-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "LicenseRef-Proprietary"
source = "optional_skills/media_download"

[registry]
name = "media_download"
capability_policy_source = "registry"

[build]
adapter = "python"
source_root = "optional_skills/media_download"
lockfile = "requirements.lock"
network = "deny"
lifecycle_scripts = false
options = { python = ">=3.10" }

[run]
launcher = "python"
entrypoint = "runtime/src/src/main.py"
working_directory = "."
timeout_seconds = 3600
environment_allowlist = ["HOME", "LANG", "LC_ALL", "LC_CTYPE", "LC_MESSAGES", "PATH", "SKILL_TIMEOUT_SECONDS", "SSL_CERT_DIR", "SSL_CERT_FILE", "TEMP", "TMP", "TMPDIR", "TZ", "WHISPER_BIN", "WHISPER_CLI", "WHISPER_CPP_BIN", "WHISPER_CPP_MODEL", "WHISPER_MODEL", "WHISPER_MODEL_PATH", "WORKSPACE_ROOT"]
smoke_args = { action = "capabilities" }

[security]
capability_policy_source = "registry"
sandbox = "workspace_write"
runtime_network = false
inherit_credentials = false

[storage]
kind = "none"
schema_version = 1
migration_owner = "media_download"

[lifecycle]
config_files = []
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"

[capability_request]
schema_version = 1
input_schema = { type = "object", required = ["action"], additionalProperties = false, properties = { action = { type = "string", enum = ["capabilities", "download", "resolve", "transcribe", "ocr", "prepare_x"] }, share = { type = "string", minLength = 1, maxLength = 20000 }, platform = { type = "string", enum = ["auto", "douyin", "kuaishou", "xiaohongshu", "tiktok", "youtube"] }, deliver_to_user = { type = "boolean" }, output_name = { type = "string", minLength = 1, maxLength = 255 }, profile_limit = { anyOf = [{ type = "integer", minimum = 1, maximum = 500 }, { type = "string", enum = ["all"] }] }, profile_interval_seconds = { type = "number", minimum = 0, maximum = 60 }, network_timeout_seconds = { type = "number", minimum = 1, maximum = 120 }, operation_timeout_seconds = { type = "integer", minimum = 5, maximum = 3500 }, browser_fallback = { type = "boolean" }, save_meta = { type = "boolean" }, show_info = { type = "boolean" }, engine = { type = "string", enum = ["whisper", "funasr"] }, language = { type = "string", minLength = 1, maxLength = 64 }, translate = { type = "boolean" }, fast = { type = "boolean" }, no_gpu = { type = "boolean" }, timestamps = { type = "boolean" }, x_compatible = { type = "boolean" }, overwrite = { type = "boolean" }, input_path = { type = "string", minLength = 1, maxLength = 4096 }, input_paths = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", minLength = 1, maxLength = 4096 } }, extract_audio_only = { type = "boolean" }, preprocess = { type = "boolean" }, psm = { type = "integer", minimum = 0, maximum = 13 }, min_line_confidence = { type = "number", minimum = -1, maximum = 100 }, check_only = { type = "boolean" }, force = { type = "boolean" }, crf = { type = "integer", minimum = 16, maximum = 35 } } }
output_schema = { type = "object", required = ["schema_version", "source_skill", "status", "action"], properties = { schema_version = { type = "integer" }, source_skill = { type = "string" }, status = { type = "string", enum = ["ok", "error"] }, action = { type = "string" }, count = { type = "integer" }, urls = { type = "array", items = { type = "string" } }, artifacts = { type = "array", items = { type = "object" } }, saved_files = { type = "array", items = { type = "object" } }, delivery = { type = "object" }, output_directory = { type = "string" }, supported_platforms = { type = "array", items = { type = "string" } }, error_code = { type = "string" }, message_key = { type = "string" }, retryable = { type = "boolean" } } }
config_entry_points = []
capabilities = [
  { name = "media_download.capabilities", action = "capabilities", effect = "observe", execution_mode = "sync_short", required = [], optional = [], timeout_seconds = 15, description = "Report supported media actions, platforms, security defaults, and optional local dependencies." },
  { name = "media_download.resolve", action = "resolve", effect = "observe", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "operation_timeout_seconds"], timeout_seconds = 3600, description = "Resolve direct media URLs from public share text or a public post URL without downloading files." },
  { name = "media_download.download", action = "download", effect = "mutate", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "deliver_to_user", "output_name", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "save_meta", "show_info", "x_compatible", "overwrite", "operation_timeout_seconds"], timeout_seconds = 3600, description = "Extract a supported URL from copied Douyin, Kuaishou, Xiaohongshu, TikTok, or YouTube share text and download only the original image/video media into the task artifact directory; deliver media to the user by default." },
  { name = "media_download.transcribe", action = "transcribe", effect = "mutate", execution_mode = "async_preferred", required = ["input_path"], optional = ["engine", "language", "extract_audio_only", "translate", "fast", "no_gpu", "timestamps", "overwrite", "operation_timeout_seconds"], timeout_seconds = 3600, description = "Extract audio and transcribe a local video or audio file using an installed local ASR engine." },
  { name = "media_download.ocr", action = "ocr", effect = "mutate", execution_mode = "async_preferred", required = ["input_paths"], optional = ["language", "preprocess", "psm", "min_line_confidence", "overwrite", "operation_timeout_seconds"], timeout_seconds = 3600, description = "Run local Tesseract OCR on one or more image files and produce a text artifact." },
  { name = "media_download.prepare_x", action = "prepare_x", effect = "mutate", execution_mode = "async_preferred", required = ["input_path"], optional = ["check_only", "force", "crf", "overwrite", "operation_timeout_seconds"], timeout_seconds = 3600, description = "Check or transcode a local video or directory into X-compatible H.264/AAC MP4 output." },
]

[capability_request.permissions]
llm_gateway = false
network = true
filesystem_read = true
filesystem_write = true
subprocess = true
package_install = false
privilege_escalation = false
external_publish = false
credential_refs = []

[capability_request.artifact_contract]
kinds = ["file", "image", "audio", "video"]
output_fields = ["extra.artifacts"]

[capability_request.evidence_contract]
required = false
selectors = ["extra.urls", "extra.artifacts", "extra.count"]
