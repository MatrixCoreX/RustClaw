schema_version = 2

[package]
name = "media_download"
version = "0.3.46"
description = "Download public media and image articles, including WeChat Channels through a user-authorized, skill-owned Yuanbao browser session. Text results are delivered as complete inline text plus a UTF-8 artifact. Explicit image OCR uses Tesseract followed by skill-owned model review for sentence boundaries, layout, punctuation, and highly certain recognition errors, with raw-text fallback. Local speech recognition is isolated in the optional local_asr package."
protocol = "agent-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "LicenseRef-Proprietary"
source = "optional_skills/media_download"

[aipp]
schema_version = 1
renderer = "task_activity_v1"
data_contract = "skill_task_activity_v1"
task_channel_scope = "all"
icon = "download"
default_locale = "en"
titles = { en = "Media Download", zh = "媒体下载" }
descriptions = { en = "Review media tasks from every channel, including WeChat Channels links handled through the skill-owned authorized browser session, processed results, failures, and downloadable output files.", zh = "查看所有通信端的媒体任务，包括通过技能专属授权浏览器处理的视频号链接、处理结果、失败原因和可下载文件。" }

[registry]
name = "media_download"
capability_policy_source = "registry"

[build]
adapter = "python"
source_root = "optional_skills/media_download"
lockfile = "requirements.lock"
network = "approval_required"
lifecycle_scripts = false
options = { python = ">=3.13" }

[install]
host_dependencies = ["git", "ffmpeg", "tesseract", "tesseract_chi_sim", "chromium"]
runtime_assets = []

[install.resources]
min_memory_mb = 256
min_free_disk_mb = 512

[run]
launcher = "python"
entrypoint = "runtime/src/src/main.py"
working_directory = "."
# The durable local-process adapter owns whole-operation lifetime and explicit
# cancellation. This ceiling applies only to one synchronous runner invocation.
timeout_seconds = 86400
environment_allowlist = ["AGENT_INTERNAL_LLM_TOKEN", "AGENT_INTERNAL_LLM_URL", "DISPLAY", "HOME", "LANG", "LC_ALL", "LC_CTYPE", "LC_MESSAGES", "PATH", "SKILL_TIMEOUT_SECONDS", "SSL_CERT_DIR", "SSL_CERT_FILE", "TEMP", "TMP", "TMPDIR", "TZ", "WAYLAND_DISPLAY", "WORKSPACE_ROOT", "XAUTHORITY", "XDG_RUNTIME_DIR"]
smoke_args = { action = "capabilities" }
progress_frames = true

[security]
capability_policy_source = "registry"
sandbox = "workspace_write"
runtime_network = false
inherit_credentials = false

[storage]
kind = "directory"
schema_version = 1
migration_owner = "media_download"

[lifecycle]
config_files = []
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"

[capability_request]
schema_version = 1
input_schema = { type = "object", required = ["action"], additionalProperties = false, properties = { action = { type = "string", enum = ["capabilities", "download", "resolve", "ocr", "prepare_x"] }, share = { type = "string", minLength = 1, maxLength = 20000 }, platform = { type = "string", enum = ["auto", "douyin", "kuaishou", "xiaohongshu", "tiktok", "youtube", "wechat_channels"] }, text_conversion_scope = { type = "string", enum = ["images_only", "audio_only", "images_and_audio", "none"], description = "Structured conversion source selection. Use images_only for visible image text, audio_only for spoken or audio content, images_and_audio only for an explicit request to process both visual and audio sources, and none for an explicit no-conversion request. Omit when no conversion was requested." }, deliver_to_user = { type = "boolean" }, output_name = { type = "string", minLength = 1, maxLength = 255 }, profile_limit = { anyOf = [{ type = "integer", minimum = 1, maximum = 500 }, { type = "string", enum = ["all"] }] }, profile_interval_seconds = { type = "number", minimum = 0, maximum = 60 }, network_timeout_seconds = { type = "number", minimum = 1, maximum = 120 }, operation_timeout_seconds = { type = "integer", minimum = 5, maximum = 2592000, description = "Optional wrapper subprocess deadline for resolve, OCR, and media preparation. Download ignores this field and has no whole-operation deadline." }, browser_fallback = { type = "boolean" }, save_meta = { type = "boolean" }, show_info = { type = "boolean" }, language = { type = "string", minLength = 1, maxLength = 64 }, x_compatible = { type = "boolean" }, overwrite = { type = "boolean" }, input_path = { type = "string", minLength = 1, maxLength = 4096 }, input_paths = { type = "array", minItems = 1, description = "Existing local image paths for OCR. Video or audio speech recognition must use local_asr.transcribe after audio.preview_transcribe selects a local provider.", items = { type = "string", minLength = 1, maxLength = 4096, pattern = "(?i)\\.(?:avif|bmp|gif|jpe?g|png|tiff?|webp)$" } }, preprocess = { type = "boolean" }, psm = { type = "integer", minimum = 0, maximum = 13 }, min_line_confidence = { type = "number", minimum = -1, maximum = 100 }, fallback_from = { type = "string", enum = ["image_vision.extract_text"] }, check_only = { type = "boolean" }, force = { type = "boolean" }, crf = { type = "integer", minimum = 16, maximum = 35 } } }
output_schema = { type = "object", required = ["schema_version", "source_skill", "status", "action"], properties = { schema_version = { type = "integer" }, source_skill = { type = "string" }, status = { type = "string", enum = ["ok", "error"] }, action = { type = "string" }, count = { type = "integer" }, urls = { type = "array", items = { type = "string" } }, artifacts = { type = "array", items = { type = "object" } }, saved_files = { type = "array", items = { type = "object" } }, source_media = { type = "object" }, content_bundle = { type = "object" }, processing_inputs = { type = "object" }, processing_outputs = { type = "object" }, followup_policy = { type = "object" }, profile_collection = { type = "object" }, article_delivery = { type = "object" }, recognition_delivery = { type = "object" }, recognition_review = { type = "object" }, delivery = { type = "object" }, output_directory = { type = "string" }, supported_platforms = { type = "array", items = { type = "string" } }, error_code = { type = "string" }, message_key = { type = "string" }, retryable = { type = "boolean" }, failure_phase = { type = "string", enum = ["pre_dispatch", "execution_no_effect", "execution_partial"] }, side_effect_applied = { type = "boolean" } } }
config_entry_points = []
capabilities = [
  { name = "media_download.capabilities", action = "capabilities", effect = "observe", execution_mode = "sync_short", required = [], optional = [], timeout_seconds = 15, description = "Report supported media actions, platforms, security defaults, and optional local dependencies." },
  { name = "media_download.resolve", action = "resolve", effect = "observe", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "operation_timeout_seconds"], description = "Resolve direct media URLs from public share text or a public post URL without downloading files. WeChat Channels uses a user-authorized Yuanbao session stored only in this skill's private browser profile." },
  { name = "media_download.download", action = "download", effect = "mutate", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "text_conversion_scope", "deliver_to_user", "output_name", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "save_meta", "show_info", "x_compatible", "overwrite"], description = "Default action for a supported public media URL or complete copied App/web share payload: preserve the complete input and immediately download original media without asking which operation is wanted. A bare https://weixin.qq.com/sph/<short-code> URL is a WeChat Channels media share and uses this dedicated media-delivery capability by default, rather than generic browser page extraction. WeChat Channels reuses this skill's private Yuanbao login and opens the official login page when authorization is missing or expired. Downloads have no whole-operation deadline; per-request network timeouts and explicit cancellation remain active. Image-article posts attempt images, platform article, and available background audio independently. Deliver every successfully retrieved component; one unavailable component must not suppress the others, and fail only when no deliverable component remains. Up to nine images are delivered individually; larger sets are preserved in one ordered ZIP. When article text is available, deliver it both inline and as a UTF-8 text artifact. Select text conversion by requested source: images_only for visible image text, audio_only for spoken or audio content, and images_and_audio only when both visual and audio sources were explicitly requested. Omit the scope when conversion was not requested. This action does not perform OCR or transcription by itself." },
  { name = "media_download.ocr", action = "ocr", effect = "mutate", execution_mode = "async_preferred", required = ["input_paths"], optional = ["language", "preprocess", "psm", "min_line_confidence", "output_name", "deliver_to_user", "overwrite", "operation_timeout_seconds", "fallback_from"], description = "Local Tesseract fallback after image_vision.extract_text fails, or when the user explicitly asks to start with local Tesseract. Then use the granted internal LLM gateway to restore sentence boundaries, layout, punctuation, and highly certain recognition errors while preserving source language and facts. Model-review failure returns the raw OCR result. Host-declared fallback sets fallback_from=image_vision.extract_text so the user-visible reply can state that the image-understanding model was unavailable. Deliver the complete result both inline and as a UTF-8 text artifact. Reject video/audio paths before dispatch; speech recognition uses local_asr.transcribe only when audio.preview_transcribe selects a local provider." },
