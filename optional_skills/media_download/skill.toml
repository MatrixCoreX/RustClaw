schema_version = 2

[package]
name = "media_download"
version = "0.3.1"
description = "For any supported public copied App share payload, short link, or website share URL, default immediately to downloading and returning the original media without asking which operation is wanted; Douyin and Xiaohongshu image-article posts return all extracted original images plus platform-provided article text by default, while image OCR remains explicit. This skill delivers article or OCR text inline below 200 characters and as a text artifact at 200 characters or more."
protocol = "agent-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "LicenseRef-Proprietary"
source = "optional_skills/media_download"

[registry]
name = "media_download"
capability_policy_source = "registry"

[build]
adapter = "python"
source_root = "optional_skills/media_download"
lockfile = "requirements.lock"
network = "approval_required"
lifecycle_scripts = false
options = { python = ">=3.13" }

[install]
host_dependencies = ["git", "ffmpeg", "tesseract", "tesseract_chi_sim", "chromium"]
runtime_assets = ["modelscope_sensevoice_small", "modelscope_fsmn_vad"]

[install.resources]
min_memory_mb = 4096
min_free_disk_mb = 6144

[run]
launcher = "python"
entrypoint = "runtime/src/src/main.py"
working_directory = "."
timeout_seconds = 300
environment_allowlist = ["HOME", "LANG", "LC_ALL", "LC_CTYPE", "LC_MESSAGES", "PATH", "SKILL_TIMEOUT_SECONDS", "SSL_CERT_DIR", "SSL_CERT_FILE", "TEMP", "TMP", "TMPDIR", "TZ", "WHISPER_BIN", "WHISPER_CLI", "WHISPER_CPP_BIN", "WHISPER_CPP_MODEL", "WHISPER_MODEL", "WHISPER_MODEL_PATH", "WORKSPACE_ROOT"]
smoke_args = { action = "capabilities" }
progress_frames = true

[security]
capability_policy_source = "registry"
sandbox = "workspace_write"
runtime_network = false
inherit_credentials = false

[storage]
kind = "directory"
schema_version = 1
migration_owner = "media_download"

[lifecycle]
config_files = []
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"

[capability_request]
schema_version = 1
input_schema = { type = "object", required = ["action"], additionalProperties = false, properties = { action = { type = "string", enum = ["capabilities", "download", "resolve", "transcribe", "ocr", "prepare_x"] }, share = { type = "string", minLength = 1, maxLength = 20000 }, platform = { type = "string", enum = ["auto", "douyin", "kuaishou", "xiaohongshu", "tiktok", "youtube"] }, deliver_to_user = { type = "boolean" }, output_name = { type = "string", minLength = 1, maxLength = 255 }, profile_limit = { anyOf = [{ type = "integer", minimum = 1, maximum = 500 }, { type = "string", enum = ["all"] }] }, profile_interval_seconds = { type = "number", minimum = 0, maximum = 60 }, network_timeout_seconds = { type = "number", minimum = 1, maximum = 120 }, operation_timeout_seconds = { type = "integer", minimum = 5, maximum = 2592000 }, browser_fallback = { type = "boolean" }, save_meta = { type = "boolean" }, show_info = { type = "boolean" }, engine = { type = "string", enum = ["whisper", "funasr"] }, language = { type = "string", minLength = 1, maxLength = 64 }, translate = { type = "boolean" }, fast = { type = "boolean" }, no_gpu = { type = "boolean" }, timestamps = { type = "boolean" }, x_compatible = { type = "boolean" }, overwrite = { type = "boolean" }, input_path = { type = "string", minLength = 1, maxLength = 4096 }, input_paths = { type = "array", minItems = 1, maxItems = 32, items = { type = "string", minLength = 1, maxLength = 4096 } }, extract_audio_only = { type = "boolean" }, preprocess = { type = "boolean" }, psm = { type = "integer", minimum = 0, maximum = 13 }, min_line_confidence = { type = "number", minimum = -1, maximum = 100 }, check_only = { type = "boolean" }, force = { type = "boolean" }, crf = { type = "integer", minimum = 16, maximum = 35 } } }
output_schema = { type = "object", required = ["schema_version", "source_skill", "status", "action"], properties = { schema_version = { type = "integer" }, source_skill = { type = "string" }, status = { type = "string", enum = ["ok", "error"] }, action = { type = "string" }, count = { type = "integer" }, urls = { type = "array", items = { type = "string" } }, artifacts = { type = "array", items = { type = "object" } }, saved_files = { type = "array", items = { type = "object" } }, content_bundle = { type = "object" }, article_delivery = { type = "object" }, recognition_delivery = { type = "object" }, delivery = { type = "object" }, output_directory = { type = "string" }, supported_platforms = { type = "array", items = { type = "string" } }, error_code = { type = "string" }, message_key = { type = "string" }, retryable = { type = "boolean" }, failure_phase = { type = "string", enum = ["pre_dispatch", "execution_no_effect", "execution_partial"] }, side_effect_applied = { type = "boolean" } } }
config_entry_points = []
capabilities = [
  { name = "media_download.capabilities", action = "capabilities", effect = "observe", execution_mode = "sync_short", required = [], optional = [], timeout_seconds = 15, description = "Report supported media actions, platforms, security defaults, and optional local dependencies." },
  { name = "media_download.resolve", action = "resolve", effect = "observe", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "operation_timeout_seconds"], description = "Resolve direct media URLs from public share text or a public post URL without downloading files." },
  { name = "media_download.download", action = "download", effect = "mutate", execution_mode = "async_preferred", required = ["share"], optional = ["platform", "deliver_to_user", "output_name", "profile_limit", "profile_interval_seconds", "network_timeout_seconds", "browser_fallback", "save_meta", "show_info", "x_compatible", "overwrite", "operation_timeout_seconds"], description = "Default action for a supported public media URL or complete copied App/web share payload: preserve the complete input and immediately download original media without asking which operation is wanted. Douyin and Xiaohongshu image-article posts return every extracted original image plus platform-provided article text by default; article text is inline below 200 characters and a text artifact at 200 or more. This is not OCR." },
  { name = "media_download.transcribe", action = "transcribe", effect = "mutate", execution_mode = "async_preferred", required = ["input_path"], optional = ["engine", "language", "extract_audio_only", "translate", "fast", "no_gpu", "timestamps", "overwrite", "operation_timeout_seconds"], description = "Extract audio and transcribe a local video or audio file using an installed local ASR engine." },
  { name = "media_download.ocr", action = "ocr", effect = "mutate", execution_mode = "async_preferred", required = ["input_paths"], optional = ["language", "preprocess", "psm", "min_line_confidence", "output_name", "deliver_to_user", "overwrite", "operation_timeout_seconds"], description = "Run local Tesseract OCR only after explicit user intent as a fallback when host multimodal image text extraction is unavailable or local processing is requested. Deliver recognized text inline below 200 characters and as image_text_ocr.txt at 200 characters or more unless the user opts out." },
  { name = "media_download.prepare_x", action = "prepare_x", effect = "mutate", execution_mode = "async_preferred", required = ["input_path"], optional = ["check_only", "force", "crf", "overwrite", "operation_timeout_seconds"], description = "Check or transcode a local video or directory into X-compatible H.264/AAC MP4 output." },
]

[capability_request.permissions]
llm_gateway = false
network = true
filesystem_read = true
filesystem_write = true
subprocess = true
package_install = false
privilege_escalation = false
external_publish = false
credential_refs = []

[capability_request.artifact_contract]
kinds = ["file", "image", "audio", "video"]
output_fields = ["extra.artifacts"]

[capability_request.evidence_contract]
required = false
selectors = ["extra.urls", "extra.artifacts", "extra.count", "extra.content_bundle"]
