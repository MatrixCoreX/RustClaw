# Reviewed against official API documentation on 2026-09-14.
# This is the sole built-in rule source; also embedded for standalone distributions.
# Rules are provider-scoped. See configs/llm_provider_errors.md for precedence.
schema_version = 1
revision = "2026-09-14.1"
code_paths = ["/error/code", "/code", "/base_resp/status_code", "/status_code", "/error/status", "/status", "/error/type", "/type"]
success_codes = ["0", "200", "OK", "Success"]

# Explicit relay binding example (never infer an upstream from model names):
# [[bindings]]
# provider_name = "my-relay"
# profile = "minimax"

[[profiles]]
id = "minimax"
hosts = ["minimaxi.com", "minimaxi.chat", "minimax.io", "minimax.chat", "minimax.cn"]
provider_names = ["vendor-minimax", "minimax"]
sources = ["https://platform.minimax.cn/docs/api-reference/errorcode"]
failure_code_paths = ["/base_resp/status_code"]
# Observed Anthropic-compatible wrapper carries the numeric code as a suffix.
# Only extract a final ASCII '(digits)', never match translated error prose.
message_code_paths = ["/error/message"]
message_code_http_statuses = [429]
[[profiles.rules]]
id = "balance_or_token_plan"
class = "quota_exhausted"
codes = ["1008", "2056"]
[[profiles.rules]]
id = "rate"
class = "rate_limited"
codes = ["1002", "2045"]
[[profiles.rules]]
id = "timeout"
class = "timeout"
codes = ["1001"]
