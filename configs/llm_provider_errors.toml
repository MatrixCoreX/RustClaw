codes = ["rate_limit_error", "rate_limit_exceeded", "slow_down"]
[[profiles.rules]]
id = "timeout"
class = "timeout"
codes = ["timeout_error"]
[[profiles.rules]]
id = "service"
class = "provider_retryable_response"
codes = ["api_error", "server_error", "overloaded_error", "service_unavailable_error", "server_is_overloaded"]
[[profiles.rules]]
