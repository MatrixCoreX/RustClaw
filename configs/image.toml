[image_edit]
adapter_mode = "auto"
allow_compat_adapters = true
anthropic_models = []
default_model = "image-01"
default_output_dir = "image/download"
default_vendor = "minimax"
google_models = ["gemini-2.5-flash-image-preview"]
grok_models = []
local_auto_upload_enabled = true
max_concurrency = 1
max_images = 4
max_input_bytes = 10485760
minimax_models = [
    "image-01",
    "image-01-live",
]
models = [
    "image-01",
    "image-01-live",
    "qwen-image-edit-max",
    "wan2.6-image",
    "wanx2.1-imageedit",
]
native_models = [
    "qwen-image-edit-max",
    "wan2.6-image",
    "wanx2.1-imageedit",
]
openai_models = ["gpt-image-1"]
oss_access_key_id = ""
oss_access_key_secret = ""
oss_bucket = ""
oss_endpoint = "oss-cn-beijing.aliyuncs.com"
oss_object_prefix = "agent-media/image"
oss_url_ttl_seconds = 3600
qwen_models = [
    "qwen-image-edit-max",
    "wan2.6-image",
    "wanx2.1-imageedit",
]
qwen_native_base_url = "https://dashscope.aliyuncs.com/api/v1"
qwen_native_function = "description_edit"
timeout_seconds = 120

[image_edit.providers.minimax]
api_key = ""
base_url = "https://api.minimaxi.com/v1"
model = "image-01"
timeout_seconds = 120

