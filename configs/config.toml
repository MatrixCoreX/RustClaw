# 用途/Purpose: 工具执行白名单/黑名单与权限配置.
# 建议修改/Recommended change: 只在明确需要时扩展 allow 或开启高权限开关.
# 风险/Risk: 扩展到 `allow=["*"]`、sudo 或工作区外路径会显著放大误调用影响.
#
# [Phase 0.1 默认安全配置收敛 - 2026-04-17]
# 已收敛项：
# - `allow_sudo`               true → false  （需要 sudo 的场景请按渠道/任务显式打开）
# - `allow_path_outside_workspace` true → false  （只读写当前 workspace 内路径）
# - `cmd_timeout_seconds`      30 → 180       （慢设备普通 shell 命令墙钟上限）
# - `cmd_idle_timeout_seconds` 新增 120       （stdout/stderr 无输出卡住上限）
# - `cmd_max_output_bytes`     新增 8000      （持续输出截断上限）
# `coding` profile 仅允许本地编码、检查、任务控制和知识读取能力；网络发布、媒体生成、
# 账户访问、安装和服务变更操作需要管理员在部署配置中按 skill/capability 显式放行；
# 只读服务状态检查由 coding profile 的 action-scoped capability 允许.
[tools]
allow = []
access_profile = "coding"
approval_policy = "on_risk"
# Global baseline switch. Runtime only honors this for admin-authenticated tasks;
# ordinary users are always treated as false even when this is true.
allow_path_outside_workspace = false
# Global baseline switch. Runtime only honors this for admin-authenticated tasks;
# ordinary users are always treated as false even when this is true.
allow_sudo = false
cmd_timeout_seconds = 180
cmd_idle_timeout_seconds = 120
# Durable background jobs have no default runtime deadline. Use the explicit
# deadline-bearing capability when a user or host policy requires one.
cmd_async_retention_seconds = 86400
cmd_terminate_grace_seconds = 5
cmd_max_output_bytes = 8000
deny = []
max_cmd_length = 2400
# `auto` 在 Linux 选择 Bubblewrap、在 macOS 选择 Seatbelt；受限模式下
# 后端不可用会结构化拒绝，不会静默降级为无沙箱执行。
sandbox_backend = "auto"
sandbox_mode = "workspace_write"

# Coding-only repository instruction discovery. Files are merged from the workspace root
# through the submitted current working directory; deeper files have higher precedence.
[workspace_instructions]
enabled_for_coding = true
enabled_for_non_coding = false
filenames = ["AGENTS.md"]
user_instruction_paths = ["<config_home>/<product_namespace>/instructions.md"]
max_total_bytes = 32768
max_file_bytes = 131072
max_files = 16

[auto_review]
enabled = false
review_role = "review"
blocking = false

# 用途/Purpose: 按模型提供商细化工具 allow/deny 覆盖.
# 建议修改/Recommended change: 可改，建议用于高风险提供商最小权限化.
# 风险/Risk: 配置冲突会导致行为与预期不一致（被拒/过放开）.
[tools.by_provider.anthropic]
allow = []
deny = []

[tools.by_provider.google]
allow = []
deny = []

[tools.by_provider.grok]
allow = []
deny = []

[tools.by_provider.openai]
allow = []
deny = []

# 用途/Purpose: worker 拉取队列并发与后台任务预算.
# 建议修改/Recommended change: 可改，需结合机器资源与任务负载.
# 风险/Risk: 并发太高会争用 CPU/IO；队列太小会丢积压能力；不要通过取消所有 timeout 来支持长任务.
[worker]
# worker 并发数 / Number of concurrent workers.
concurrency = 3
# 轮询间隔（毫秒） / Queue polling interval in milliseconds.
poll_interval_ms = 500
# 队列上限 / Max queued tasks in memory.
queue_limit = 128
# Track K timeout 分层语义：
# - API/channel 请求超时只影响调用方等待，不代表后台任务失败；
# - worker heartbeat/lease 用于判断 running 任务是否失联；
# - tool/skill 自身 timeout 判断单个工具是否超时；
# - provider timeout / retry / circuit breaker 判断单次链路是否可用；
# - agent loop soft budget 应 checkpoint 后进入 waiting/background，而不是无限循环。
# 运行中心跳间隔（秒）：执行长任务时周期刷新 updated_at，避免误判“卡死”。
task_heartbeat_seconds = 30
# 运行中“无进展”超时（秒）：status=running 且 updated_at 长时间不变会进入 recovery 收尾。
running_no_progress_timeout_seconds = 1200
# 无进展清理检查间隔（秒）。
running_recovery_check_interval_seconds = 60
# Worker 不设置统一任务墙钟超时。长任务通过 checkpoint/durable job 释放 worker；
# 终止只来自显式 deadline、用户取消、单次 tool/provider timeout、资源策略或失联 lease 回收。
# 模型 turn、工具调用、累计时长、token/cost 和 continuation 的管理员上限
# 统一配置在 configs/agent_guard.toml 的 [agent.task_budget]。

# 真正的远程执行节点独立于远程 API 调用，默认关闭。开启前必须同时配置
# endpoint 和受信任的 attestation digest；未配置时不会静默退回本机执行。
[worker.remote_executor]
enabled = false
trusted_attestation_digests = []
