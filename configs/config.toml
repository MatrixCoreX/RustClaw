# Phase 2.5: per-vendor 默认参数（可选）。不写就沿用 vendor 默认；写了会
# 在 chat 调用没显式传 hints 时生效。例：
# [llm.qwen.params]
# default_temperature = 0.4
# default_max_tokens  = 2048
# top_p               = 0.9

# 用途/Purpose: MiniMax 提供商连接与模型池（OpenAI-compatible）.
# 建议修改/Recommended change: 默认使用官方最新 `MiniMax-M3`；模型池按
# MiniMax 当前 M-series 兼容列表维护.
# api_format：省略或空则默认 openai_compat（/chat/completions + Bearer）；设为 anthropic_claude 则 /messages + x-api-key（clawd 合成 vendor-minimax）.
# 能力/Capabilities: MiniMax-M3 是 1M context 的原生多模态语言模型；
# OpenAI-compatible / Anthropic-compatible 文本接口支持 text、image、video
# 输入（M2.x 仅 text/tool-call）。音频输入不由 M3 文本接口支持；语音合成
# 仍走 configs/audio.toml 的 speech-2.8-*，图片生成/编辑仍走 configs/image.toml
# 的 image-01。
# 风险/Risk: M3 图片/视频理解走 chat-compatible content parts；本仓库文生图、
# 图像编辑不是 M3 能力，不能把 M3 填到 image_generation/image_edit 模型.
[llm.minimax]
api_key = ""
# Endpoint note: this deployment uses the user-provided
# https://api.minimaxi.com/v1 MiniMax-compatible endpoint. Switch only when
# the account region / gateway explicitly requires a different endpoint.
base_url = "https://api.minimaxi.com/v1"
max_concurrency = 2
model = "MiniMax-M3"
# Optional prompt-budget capacity override for compatible providers whose
# public model name does not expose a reliable context window. MiniMax official
# docs list MiniMax-M3 with a 1,000,000-token context window; keep this aligned
# with the active text model so routing prompts can use the larger window.
context_window_tokens = 1000000
models = [
    "MiniMax-M3",
    "MiniMax-M2.7",
    "MiniMax-M2.7-highspeed",
    "MiniMax-M2.5",
    "MiniMax-M2.5-highspeed",
    "MiniMax-M2.1",
    "MiniMax-M2.1-highspeed",
    "MiniMax-M2",
]
input_modalities = ["text", "image", "video"]
output_modalities = ["text"]
supports_tools = true
expected_latency_ms = 5000
# MiniMax text routing/model calls can be slow under load. This is a per-call
# transport timeout; total task resources are owned by [agent.task_budget].
timeout_seconds = 180

# 用途/Purpose: Xiaomi MiMo 提供商连接与模型池（OpenAI-compatible，兼容 Anthropic 协议）.
# 建议修改/Recommended change: 默认为 OpenAI-compatible；如切换 Anthropic-compatible，
# 将 api_format 设为 "anthropic_claude" 并把 base_url 改为
# "https://token-plan-sgp.xiaomimimo.com/anthropic".
# 风险/Risk: base_url、api_format、模型名必须与小米 MiMo 当前网关保持一致.
[llm.mimo]
api_key = ""
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
max_concurrency = 1
model = "mimo-v2.5-pro"
models = [
    "mimo-v2.5-pro",
    "mimo-v2.5",
]
input_modalities = ["text"]
output_modalities = ["text"]
supports_tools = true
