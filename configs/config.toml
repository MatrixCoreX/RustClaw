# =============================================================================
# [DEMO TEMPLATE - 不是生产默认值]
#
# 本文件是 agent runtime 自带的 demo / 开发模板，里面部分权限字段（tools.allow=["*"]、
# tools.allow_sudo 等）为了演示方便而放宽。
#
# 真正的代码默认值（`*Config::default()` / `serde(default = ...)`) 已经
# 在 Phase 0.1 / L4 收敛为安全基线：
#   - ToolsConfig::default()               => allow=[], allow_sudo=false,
#                                              allow_path_outside_workspace=false
#   - default_skill_timeout_seconds()      => 30s
#   - default_tool_cmd_timeout_seconds()   => 180s
#
# 部署生产环境的推荐做法：
#   1. 复制本文件，删除 [tools] 整节让它走代码安全默认，或显式只保留需要的字段。
#   2. tools.allow 显式列出需要的技能，避免 ["*"]。
#   3. 把本文件路径换成自己的 configs/<env>.toml，避免 demo 模板被无意继承。
#
# 不动本文件、直接用 demo 部署也能运行，但权限面较大，请知悉。
# =============================================================================

# 用途/Purpose: 默认回复语言与结构化 verifier 配置.
# 建议修改/Recommended change: 可按部署语言调整.
# 风险/Risk: locale 配错会影响无明确语言提示时的回复语言.
[command_intent]
# 默认语言 / Default response locale.
default_locale = "zh-CN"

# 用途/Purpose: 数据库连接基础参数.
# 建议修改/Recommended change: 可改（尤其是路径）.
# 风险/Risk: 超时太短会频繁 busy；路径错误会导致服务无法启动/读写.
[database]
# SQLite busy 超时（毫秒） / SQLite busy timeout in milliseconds.
busy_timeout_ms = 5000
# SQLite 文件路径 / SQLite file path.
sqlite_path = "data/agent-runtime.db"
# 技能私有数据库根目录；每个持久化技能只访问自己的 `<skill>/state.db`。
# Skill-owned database root; each persisted skill may access only its own
# `<skill>/state.db`.
skill_data_root = "data/skills"
# Phase 2.2 Stage 2: audit_logs 走独立 SQLite 文件 + 独立连接池，避免与任务/调度
# 写入争抢同一份 writer 锁。首次启动时若主库还有 audit_logs 数据，会自动一次性
# 迁移到这里，然后清空主库副本。
# Audit logs are isolated to their own SQLite file/pool to avoid writer-lock
# contention with tasks/schedule. On first boot any rows still in the main DB
# are migrated here once and then cleared from main.
audit_sqlite_path = "data/agent-runtime-audit.db"
# audit pool 上限：审计写入是低并发 append-only，2 条够用 / cap is small because
# audit writes are low-concurrency append-only.
audit_pool_max_size = 2

# 用途/Purpose: 文档/文件生成默认输出目录.
# 建议修改/Recommended change: 可改.
# 风险/Risk: 目录不可写会导致文件生成失败.
[file_generation]
default_output_dir = "document"

# Image skill config moved to configs/image.toml (supports default_model + <vendor>_models fallback) / 图片技能配置已拆分到 configs/image.toml（支持 default_model + 按厂商备选模型）

# Audio skill config moved to configs/audio.toml (supports default_model + <vendor>_models fallback) / 语音技能配置已拆分到 configs/audio.toml（支持 default_model + 按厂商备选模型）

# 用途/Purpose: 全局与单用户限流.
# 建议修改/Recommended change: 可改，建议结合流量观测渐进调整.
# 风险/Risk: 太低会限流过严；太高可能触发上游配额或成本飙升.
[limits]
# 全局每分钟请求数 / Global requests per minute.
global_rpm = 60
# 单用户每分钟请求数 / Per-user requests per minute.
user_rpm = 20
# 为下一次工具结果预留的上下文 token；不会缩短任务总运行时间。
context_tool_observation_reserve_tokens = 2048
# 本地 token 估算与厂商 usage 存在误差时使用的最小安全余量。
context_estimator_safety_margin_tokens = 512

# 用途/Purpose: LLM 路由默认选择（厂商与模型）.
# 建议修改/Recommended change: 可改.
# 风险/Risk: vendor/model 不匹配会导致调用失败.
[llm]
# 文本类 skill 声明 capabilities=["llm"] 后默认使用这里的全局选择；
# 除非某个 skill 的专用配置文件明确提供并启用独立覆盖项，否则不要为每个文本 skill 单独指定模型。
# Text skills use this global selection by default; per-skill text model overrides should be explicit and opt-in.
# 默认模型名 / Default selected model.
selected_model = "MiniMax-M3"
# 默认厂商标识 / Default selected vendor.
selected_vendor = "minimax"

# Beginner-facing managed relay preset. Selecting it in the UI configures the
# existing custom OpenAI-compatible provider; the per-device credential stays
# in the private runtime credential broker rather than this tracked file.
[llm.hosted_relay]
enabled = true
vendor = "custom"
model = "minimax"
base_url = "https://llm.matrixai.one/v1"
daily_request_limit = 100

[llm.model_classes.default]
provider = "minimax"
model = "MiniMax-M3"

[llm.model_classes.fast]
provider = "minimax"
model = "MiniMax-M2.7-highspeed"

[llm.model_classes.reasoning]
provider = "minimax"
model = "MiniMax-M3"

[llm.cost_governance]
enabled = true
soft_task_usd = 0.50
soft_user_24h_usd = 10.0
soft_provider_24h_usd = 100.0
hard_task_usd = 5.0
checkpoint_retry_after_seconds = 3600

# Optional machine-readable price catalog. Runtime records `unknown` when the
# active provider/model has no matching entry or the provider omits usage.
[[llm.pricing]]
provider = "minimax"
model = "MiniMax-M3"
effective_from = "2026-07-18"
currency = "USD"
source = "https://platform.minimax.io/docs/guides/pricing-paygo"
input_usd_per_million = 0.30
output_usd_per_million = 1.20
cache_read_usd_per_million = 0.06
long_context_threshold_tokens = 512000
long_context_input_usd_per_million = 0.60
long_context_output_usd_per_million = 2.40
long_context_cache_read_usd_per_million = 0.12

[[llm.pricing]]
provider = "minimax"
model = "MiniMax-M2.7"
effective_from = "2026-07-18"
currency = "USD"
source = "https://platform.minimax.io/docs/guides/pricing-paygo"
input_usd_per_million = 0.30
output_usd_per_million = 1.20
cache_read_usd_per_million = 0.06
cache_write_usd_per_million = 0.375

# 用途/Purpose: Anthropic 提供商连接与模型池.
# 建议修改/Recommended change: 可改，需保证 key/base_url/model 对齐.
# 风险/Risk: key 无效或 URL 错误会直接失败；并发过高可能触发限流.
[llm.anthropic]
api_key = ""
base_url = "https://api.anthropic.com/v1"
supports_tools = true
# 该提供商最大并发 / Max concurrency for this provider.
max_concurrency = 1
# 默认模型 / Default model for this provider.
model = "claude-sonnet-4-6"
# 可选模型池 / Allowed model candidates.
models = [
    # 4.6 (latest / 最新)
    "claude-opus-4-6",           # Top intelligence, agent/coding 最强智能 $5/$25
    "claude-sonnet-4-6",         # Balanced speed/intelligence 均衡推荐 $3/$15
    # 4.5
    "claude-haiku-4-5-20251001", # Fastest, high-throughput 最快低延迟 $1/$5
    # Legacy / 旧版
    "claude-3-7-sonnet-latest",
    "claude-3-5-haiku-latest",
]
# 单次请求超时（秒） / Request timeout in seconds.
timeout_seconds = 60

