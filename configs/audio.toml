local_server_threads = 4
max_concurrency = 1
max_input_bytes = 26214400
minimax_models = []
models = [
    "local-whisper",
    "whisper-1",
    "qwen3-asr-flash",
    "fun-asr",
    "fun-asr-mtl",
    "qwen3-asr-flash-filetrans",
