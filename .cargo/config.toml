# Use the LLD bundled with the active Rust toolchain for native Linux links.
# Cross-build scripts set CARGO_TARGET_*_LINKER explicitly, so their platform
# toolchains continue to take precedence over these host defaults.
[target.x86_64-unknown-linux-gnu]
linker = "scripts/rust-linker.sh"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/rust-linker.sh"
