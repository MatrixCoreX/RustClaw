[workspace]
resolver = "2"

[package]
name = "agent-desktop"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Secure desktop client for an existing agent device"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:rfd", "dep:open"]

[dependencies]
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring = "=4.2.0"
mdns-sd = "=0.21.3"
if-addrs = "=0.15.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.5", optional = true , features = [] }
rfd = { version = "0.17", optional = true }
open = { version = "5", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "=0.5.1"

[dev-dependencies]
rand = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

[[bin]]
name = "agent-desktop"
path = "src/main.rs"
required-features = ["gui"]
