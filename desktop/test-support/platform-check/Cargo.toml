[workspace]
[package]
name="desktop-platform-check"
version="0.1.0"
edition="2021"
[dependencies]
uuid={version="1",features=["v4"]}
zeroize="1"
tempfile="3"
getrandom="0.2.17"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem", "Win32_Security_Authorization",
    "Win32_System_Memory", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_System_Pipes", "Win32_System_Console", "Win32_System_IO",
    "Win32_System_ErrorReporting", "Win32_UI_WindowsAndMessaging",
    "Win32_System_RemoteDesktop",
] }

