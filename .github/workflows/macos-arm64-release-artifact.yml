name: Build macOS Release Artifact

"on":
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact commit or tag to package."
        required: true
        type: string
      release_version:
        description: "Release version used in the package filename."
        required: true
        type: string
      architecture:
        description: "Native Mac architecture to build."
        required: true
        default: aarch64
        type: choice
        options:
          - aarch64
          - x86_64

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  python-wheels:
    uses: ./.github/workflows/release-python-wheels.yml
    with:
      target: ${{ inputs.architecture }}-apple-darwin
      source_ref: ${{ inputs.source_ref }}
  build-macos:
    needs: python-wheels
    name: Build verified macOS ${{ inputs.architecture }} package
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    env:
      PACKAGE_ARCH: ${{ inputs.architecture }}
      RUST_TARGET: ${{ inputs.architecture }}-apple-darwin
      NATIVE_ARCH: ${{ inputs.architecture == 'aarch64' && 'arm64' || 'x86_64' }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"

    steps:
      - name: Checkout requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Verify native architecture and release metadata
        id: meta
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source scripts/product_identity.sh
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host_target}" != "${RUST_TARGET}" || "$(uname -m)" != "${NATIVE_ARCH}" ]]; then
            echo "native macOS ${NATIVE_ARCH} runner required: host_target=${host_target} uname=$(uname -m)" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release version must contain only letters, numbers, dot, underscore, and hyphen" >&2
            exit 1
          fi
          resolved_commit="$(git rev-parse HEAD)"
          expected_commit="$(git rev-parse "${SOURCE_REF}^{commit}")"
          if [[ "${resolved_commit}" != "${expected_commit}" ]]; then
            echo "checked out commit does not match requested source ref" >&2
            exit 1
          fi
          package_name="${APP_RELEASE_ARTIFACT_ID}-macos-${PACKAGE_ARCH}-${RELEASE_VERSION}.tar.gz"
          installer_name="${APP_RELEASE_ARTIFACT_ID}-macos-${PACKAGE_ARCH}-${RELEASE_VERSION}-installer.pkg"
          release_tag="macos-${PACKAGE_ARCH}-${RELEASE_VERSION}"
          {
            echo "commit=${resolved_commit}"
            echo "package_name=${package_name}"
            echo "installer_name=${installer_name}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Prepare relocatable macOS Python runtime
        shell: bash
        run: |
          set -euo pipefail
          case "${PACKAGE_ARCH}" in
            aarch64) python_sha256=d66c67f16148c7454b1509c32747175f7669c8b8e105b97b92a0000d66af6e6e ;;
            x86_64) python_sha256=73b503a2d3f47f0601265d7936744b77dc4ee75d2a3e88a470594a014dcf6822 ;;
            *) exit 64 ;;
          esac
          archive="cpython-3.13.15+20260929-${RUST_TARGET}-install_only_stripped.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --retry 3 --output "${archive_path}" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260929/${archive}"
          echo "${python_sha256}  ${archive_path}" | shasum -a 256 -c -
          runtime_parent="${RUNNER_TEMP}/relocatable-python"
          mkdir -p "${runtime_parent}"
          tar -xzf "${archive_path}" -C "${runtime_parent}"
          runtime_root="${runtime_parent}/python"
          env -i HOME="$HOME" PATH=/usr/bin:/bin \
            "${runtime_root}/bin/python3" -I -c 'import json, ssl, tomllib, venv; print(json.dumps({"runtime":"standalone_python"}))'
          if otool -L "${runtime_root}/bin/python3" | grep -F '/Library/Frameworks/Python.framework'; then
            echo "Packaged Python must not require a separately installed Framework" >&2
            exit 1
          fi
          echo "APP_RELEASE_PYTHON_RUNTIME_ROOT=${runtime_root}" >> "$GITHUB_ENV"
          echo "APP_PYTHON_BIN=${runtime_root}/bin/python3" >> "$GITHUB_ENV"
          echo "${runtime_root}/bin" >> "$GITHUB_PATH"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Cache Cargo registry and git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test UI
        shell: bash
        run: |
          set -euo pipefail
          cd UI
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

      - name: Verify release and skill contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/security -p test_release_config_guard.py
          python3 -m unittest discover -s scripts/tests -p test_release_skill_sources.py
          python3 -m unittest discover -s scripts/tests -p test_macos_system_browser.py
          python3 -m unittest discover -s optional_skills/media_download/tests -p test_macos_browser_selection.py
          node --test optional_skills/media_discovery/test/macos_browser_selection.test.mjs
          python3 scripts/check_product_identity_coupling.py --self-test
          python3 scripts/check_product_identity_coupling.py
          python3 scripts/check_polyglot_skill_contracts.py --self-test
          python3 scripts/check_polyglot_skill_contracts.py --require-all
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_cross_platform_contracts.py
          python3 scripts/check_rag_contracts.py --self-test
          python3 scripts/check_rag_contracts.py

      - name: Prepare locked browser skill runtime assets
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix crates/skills/browser_web
          npm ci --ignore-scripts --prefix optional_skills/media_discovery

      - name: Test signed system browser and isolated skill profiles
        shell: bash
        run: |
          set -euo pipefail
          if ! bash scripts/macos-system-browser.sh --resolve-executable; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask google-chrome
          fi
          node --test optional_skills/media_discovery/test/*.test.mjs
          MEDIA_DISCOVERY_BROWSER_TEST=1 node --test \
            optional_skills/media_discovery/test/browser_environment.integration.test.mjs
          node --test crates/skills/browser_web/*tests.js
          python3 -m unittest discover -s scripts/tests -p test_macos_system_browser.py

      - name: Test host dependency contracts
        run: cargo test -p clawd host_dependencies -- --nocapture

      - name: Test Release installation boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_release*.py'

      - name: Build native runtime and proactive skill receipts
        shell: bash
        run: |
          set -euo pipefail
          ./build-all.sh no-ui --target host

      - name: Download verified native dependency bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --pattern "release-wheels-${RUST_TARGET}-*" --dir release-wheel-bundles

      - name: Precompile platform Skill Store packages
        shell: bash
        env:
          APP_PRECOMPILE_ALL_BUNDLED_SKILLS: "1"
          APP_RELEASE_PYTHON_WHEELS_ROOT: ${{ github.workspace }}/release-wheel-bundles
        run: |
          set -euo pipefail
          ./scripts/precompile_skill_store.sh "${RUST_TARGET}"

      - name: Bundle macOS skill software dependencies
        shell: bash
        env:
          CHI_SIM_SHA256: a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730
          WHISPER_MODEL_SHA256: 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
          WHISPER_SOURCE_COMMIT: 306c88f4d1286aec1bf96e544632897886af5501
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install cmake ffmpeg tesseract git
          if ! bash scripts/macos-system-browser.sh --resolve-executable; then
            brew install --cask google-chrome
          fi

          whisper_source="${RUNNER_TEMP}/whisper-cpp-source"
          whisper_build="${RUNNER_TEMP}/whisper-cpp-build"
          git init -q "${whisper_source}"
          git -C "${whisper_source}" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "${whisper_source}" fetch -q --depth=1 origin "${WHISPER_SOURCE_COMMIT}"
          git -C "${whisper_source}" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "${whisper_source}" rev-parse HEAD)" == "${WHISPER_SOURCE_COMMIT}" ]]
          cmake -S "${whisper_source}" -B "${whisper_build}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_METAL=OFF \
            -DGGML_OPENMP=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_TESTS=OFF
          cmake --build "${whisper_build}" --config Release --target whisper-cli --parallel 4
          whisper_cli="${whisper_build}/bin/whisper-cli"
          [[ -x "${whisper_cli}" ]]
          if otool -L "${whisper_cli}" | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "whisper-cli retained a Homebrew runtime dependency" >&2
            exit 1
          fi

          dependency_downloads="${RUNNER_TEMP}/skill-dependency-downloads"
          mkdir -p "${dependency_downloads}"
          curl --fail --location --retry 3 \
            --output "${dependency_downloads}/chi_sim.traineddata" \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/chi_sim.traineddata
          echo "${CHI_SIM_SHA256}  ${dependency_downloads}/chi_sim.traineddata" | shasum -a 256 -c -
          curl --fail --location --retry 3 \
            --output "${dependency_downloads}/ggml-base.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          echo "${WHISPER_MODEL_SHA256}  ${dependency_downloads}/ggml-base.bin" | shasum -a 256 -c -

          python3 scripts/bundle_macos_skill_dependencies.py \
            --destination "target/release-host-tools/${RUST_TARGET}" \
            --git-prefix "$(brew --prefix git)" \
            --ffmpeg "$(brew --prefix ffmpeg)/bin/ffmpeg" \
            --ffprobe "$(brew --prefix ffmpeg)/bin/ffprobe" \
            --tesseract "$(brew --prefix tesseract)/bin/tesseract" \
            --tessdata "$(brew --prefix tesseract)/share/tessdata" \
            --chi-sim "${dependency_downloads}/chi_sim.traineddata" \
            --whisper-cli "${whisper_cli}" \
            --whisper-model "${dependency_downloads}/ggml-base.bin"

      - name: Verify native skill receipts
        shell: bash
        run: |
          set -euo pipefail
          target/release/skillctl receipt-verify \
            "target/skill-packages/${RUST_TARGET}" \
            health_check
          while IFS= read -r skill_name; do
            [[ -n "${skill_name}" ]] || continue
            target/release/skillctl receipt-verify \
              "target/prebuilt-skill-packages/${RUST_TARGET}" \
              "${skill_name}" >/dev/null
          done < <(
            python3 scripts/skill_store_packages.py \
              --scope platform-precompiled --target "${RUST_TARGET}" --format skills
          )

      - name: Package runtime
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          [[ -n "${RELEASE_SIGNING_KEY}" ]] || { echo "RELEASE_SIGNING_KEY is required" >&2; exit 1; }
          signing_key="${RUNNER_TEMP}/release-signing-key"
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > "${signing_key}"
          chmod 600 "${signing_key}"
          python_runtime_root="${APP_RELEASE_PYTHON_RUNTIME_ROOT:?standalone Python runtime missing}"
          node_runtime_root="$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().parent.parent)' "$(command -v node)")"
          [[ -x "${python_runtime_root}/bin/python3" ]]
          [[ -x "${node_runtime_root}/bin/node" ]]
          mkdir -p dist-release
          APP_RELEASE_BIN_DIR="$PWD/target/release" \
            APP_RELEASE_PYTHON_WHEELS_ROOT="$PWD/release-wheel-bundles" \
            APP_RELEASE_PYTHON_RUNTIME_ROOT="${python_runtime_root}" \
            APP_RELEASE_NODE_RUNTIME_ROOT="${node_runtime_root}" \
            APP_RELEASE_HOST_TOOLS_ROOT="$PWD/target/release-host-tools/${RUST_TARGET}" \
            APP_PACKAGE_TARGET="${RUST_TARGET}" \
            APP_RELEASE_COMMIT="${RELEASE_COMMIT}" \
            APP_RELEASE_INSTALL_ALL_BUNDLED_SKILLS=1 \
            APP_RELEASE_SIGNING_KEY="${signing_key}" \
            APP_BUNDLE_DIR="$PWD/dist-release" \
            APP_PACKAGE_BASENAME="${{ steps.meta.outputs.package_name }}" \
            APP_SKIP_LOCAL_PACKAGE_COPY=1 \
            ./package-release.sh
          (
            cd dist-release
            shasum -a 256 "${{ steps.meta.outputs.package_name }}" \
              > "${{ steps.meta.outputs.package_name }}.sha256"
          )

      - name: Build all-in-one macOS desktop installer
        shell: bash
        env:
          APP_DESKTOP_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/dist-release
          APP_DESKTOP_RUNTIME_RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          DESKTOP_NATIVE_TARGET: ${{ env.RUST_TARGET }}
        run: |
          set -euo pipefail
          export APP_DESKTOP_BOOTSTRAP_PYTHON_ROOT="${APP_RELEASE_PYTHON_RUNTIME_ROOT:?standalone Python runtime missing}"
          npm ci --prefix desktop
          npm run build --prefix desktop -- --target "${RUST_TARGET}" --bundles app
          app="desktop/target/${RUST_TARGET}/release/bundle/macos/agent-desktop.app"
          [[ -d "${app}" ]]
          [[ -f "${app}/Contents/Resources/embedded-runtime/bundle.json" ]]
          [[ -f "${app}/Contents/Resources/embedded-runtime/release/${{ steps.meta.outputs.package_name }}" ]]
          [[ -f "${app}/Contents/Resources/embedded-runtime/bootstrap/deploy-github-release.sh" ]]
          [[ -x "${app}/Contents/Resources/embedded-runtime/bootstrap/toolchains/python/bin/python3" ]]
          codesign --verify --deep --strict "${app}"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "${app}" \
            "dist-release/agent-desktop_${desktop_version}_macos-${PACKAGE_ARCH}.app.zip"
          dmg="dist-release/agent-desktop_${desktop_version}_macos-${PACKAGE_ARCH}.dmg"
          ./desktop/scripts/build-macos-dmg.sh "${app}" "${dmg}"
          ./desktop/scripts/build-macos-pkg.sh \
            "${app}" \
            "dist-release/${{ steps.meta.outputs.installer_name }}"
          (
            cd dist-release
            for asset in agent-desktop_*.dmg agent-desktop_*.app.zip; do
              shasum -a 256 "${asset}" > "${asset}.sha256"
            done
          )

      - name: Free transient build space before install smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target desktop/target release-wheel-bundles
          df -h .

      - name: Install-test PKG, bundled skills, and overwrite upgrade
        shell: bash
        env:
          INSTALLER_PKG: ${{ github.workspace }}/dist-release/${{ steps.meta.outputs.installer_name }}
        run: |
          set -euo pipefail
          installed_app="/Applications/agent-desktop.app"
          [[ ! -e "${installed_app}" ]] || {
            echo "macOS runner unexpectedly contains ${installed_app}" >&2
            exit 1
          }
          app_identifier="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("desktop/tauri.conf.json").read_text())["identifier"])
          PY
          )"
          app_data="${HOME}/Library/Application Support/${app_identifier}"
          state_file="${app_data}/bundled-runtime-install-v1.json"
          launch_log="${RUNNER_TEMP}/installed-desktop.log"

          cleanup() {
            if [[ -n "${desktop_pid:-}" ]]; then
              kill "${desktop_pid}" >/dev/null 2>&1 || true
              wait "${desktop_pid}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${runtime_root:-}" && -x "${runtime_root}/stop-agent.sh" ]]; then
              "${runtime_root}/stop-agent.sh" >/dev/null 2>&1 || true
            fi
            sudo rm -rf "${installed_app}" "${app_data}"
          }
          trap cleanup EXIT

          current_executable_fingerprint() {
            python3 -c 'import os, sys; value = os.stat(sys.argv[1]); print(f"{value.st_dev}:{value.st_ino}:{value.st_size}:{int(value.st_mtime)}:{value.st_mtime_ns % 1_000_000_000}")' \
              "${installed_app}/Contents/MacOS/agent-desktop"
          }

          state_executable_fingerprint() {
            python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["executable_fingerprint"])' \
              "${state_file}" 2>/dev/null
          }

          wait_for_runtime_install() {
            for _ in $(seq 1 180); do
              if [[ -f "${state_file}" ]]; then
                state_fingerprint="$(state_executable_fingerprint || true)"
                current_fingerprint="$(current_executable_fingerprint || true)"
                if [[ -n "${state_fingerprint}" && \
                  "${state_fingerprint}" == "${current_fingerprint}" ]]; then
                  return 0
                fi
              fi
              if ! kill -0 "${desktop_pid}" >/dev/null 2>&1; then
                cat "${launch_log}" >&2 || true
                echo "Installed desktop exited before bundled setup completed." >&2
                return 1
              fi
              sleep 5
            done
            cat "${launch_log}" >&2 || true
            cat "${app_data}/bundled-runtime-install.log" >&2 || true
            echo "Bundled runtime setup did not finish within 15 minutes." >&2
            return 1
          }

          sudo installer -pkg "${INSTALLER_PKG}" -target /
          [[ -x "${installed_app}/Contents/MacOS/agent-desktop" ]]
          descriptor="${installed_app}/Contents/Resources/embedded-runtime/bundle.json"
          [[ -f "${descriptor}" ]]
          descriptor_digest="$(shasum -a 256 "${descriptor}" | awk '{print $1}')"

          APP_BUNDLED_RUNTIME_NONINTERACTIVE=1 \
            "${installed_app}/Contents/MacOS/agent-desktop" \
            >"${launch_log}" 2>&1 &
          desktop_pid=$!
          wait_for_runtime_install
          runtime_root="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["runtime_root"])' \
            "${state_file}")"
          [[ -f "${runtime_root}/.release-tag" ]]
          [[ -x "${runtime_root}/target/release/skillctl" ]]
          [[ -x "${runtime_root}/prebuilt/toolchains/python/bin/python3" ]]
          env -i HOME="$HOME" PATH=/usr/bin:/bin \
            "${runtime_root}/prebuilt/toolchains/python/bin/python3" -I -c 'import ssl, tomllib'
          [[ -x "${runtime_root}/prebuilt/toolchains/node/bin/node" ]]
          host_tools="${runtime_root}/prebuilt/toolchains/host"
          for tool in git ffmpeg ffprobe tesseract chromium whisper-cli; do
            [[ -x "${host_tools}/bin/${tool}" ]]
          done
          [[ -f "${host_tools}/share/tessdata/chi_sim.traineddata" ]]
          [[ -f "${host_tools}/models/whisper/ggml-base.bin" ]]
          "${host_tools}/bin/git" --version
          "${host_tools}/bin/ffmpeg" -version >/dev/null
          "${host_tools}/bin/ffprobe" -version >/dev/null
          "${host_tools}/bin/tesseract" --list-langs | grep -qx 'chi_sim'
          # A vendor-signed system browser is a host dependency, not a copied app bundle.
          [[ ! -e "${host_tools}/chromium/Chromium.app" ]]
          "${host_tools}/bin/chromium" --version
          "${host_tools}/bin/chromium" --resolve-executable
          speech_fixture="${RUNNER_TEMP}/bundled-media-smoke.aiff"
          media_fixture="${RUNNER_TEMP}/bundled-media-smoke.wav"
          /usr/bin/say -o "${speech_fixture}" \
            "Release package transcription smoke test."
          [[ -s "${speech_fixture}" ]]
          "${host_tools}/bin/ffmpeg" -hide_banner -loglevel error \
            -i "${speech_fixture}" -ar 16000 -ac 1 -c:a pcm_s16le -y "${media_fixture}"
          "${host_tools}/bin/ffprobe" -v error -select_streams a:0 \
            -show_entries stream=codec_name -of default=nw=1 "${media_fixture}" | grep -q 'codec_name=pcm_s16le'
          "${host_tools}/bin/whisper-cli" \
            -m "${host_tools}/models/whisper/ggml-base.bin" \
            -f "${media_fixture}" -nt --no-gpu >/dev/null
          if [[ "${PACKAGE_ARCH}" == "aarch64" ]]; then
            find "${runtime_root}/data/skills/local_asr" -type f -name model.pt -print -quit | grep -q .
          fi

          expected_count=0
          while IFS= read -r skill_name; do
            [[ -n "${skill_name}" ]] || continue
            expected_count=$((expected_count + 1))
            "${runtime_root}/target/release/skillctl" receipt-verify \
              "${runtime_root}/data/skill-packages" "${skill_name}" >/dev/null
          done < <(
            python3 scripts/skill_store_packages.py \
              --scope platform-on-demand --target "${RUST_TARGET}" --format skills
          )
          [[ "${expected_count}" -gt 0 ]]

          kill "${desktop_pid}" >/dev/null 2>&1 || true
          wait "${desktop_pid}" >/dev/null 2>&1 || true
          desktop_pid=""
          data_sentinel="${runtime_root}/data/pkg-overwrite-smoke.keep"
          printf '%s\n' "preserve-user-data" > "${data_sentinel}"
          printf '%s\n' "corrupted-managed-app-file" | sudo tee "${descriptor}" >/dev/null

          sudo installer -pkg "${INSTALLER_PKG}" -target /
          [[ "$(shasum -a 256 "${descriptor}" | awk '{print $1}')" == "${descriptor_digest}" ]]
          [[ "$(cat "${data_sentinel}")" == "preserve-user-data" ]]

          APP_BUNDLED_RUNTIME_NONINTERACTIVE=1 \
            "${installed_app}/Contents/MacOS/agent-desktop" \
            >>"${launch_log}" 2>&1 &
          desktop_pid=$!
          wait_for_runtime_install
          [[ "$(cat "${data_sentinel}")" == "preserve-user-data" ]]
          printf 'macos_pkg_smoke=passed skills=%s runtime=%s\n' \
            "${expected_count}" "${runtime_root}"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist-release/${{ steps.meta.outputs.package_name }}

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-runtime-macos-${{ inputs.architecture }}-${{ inputs.release_version }}
          path: |
            dist-release/${{ steps.meta.outputs.package_name }}
            dist-release/${{ steps.meta.outputs.package_name }}.sha256
            dist-release/${{ steps.meta.outputs.package_name }}.spdx.json
            dist-release/${{ steps.meta.outputs.package_name }}.manifest.json
            dist-release/${{ steps.meta.outputs.package_name }}.manifest.json.sig
