name: Runtime operations protection verification

"on":
  push:
    branches: ["ci/runtime-operations-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cache: linux-runtime-read
          - os: macos-15
            cache: macos-runtime-read
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config clang libclang-dev protobuf-compiler ripgrep
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf ripgrep
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.cache }}
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Check runtime contracts and product independence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_long_files.py
          python3 scripts/check_cross_platform_contracts.py
          for checker in product_identity_coupling skill_storage_ownership task_event_archive_contracts task_event_context_team_contracts; do
            python3 "scripts/check_${checker}.py" --self-test
            python3 "scripts/check_${checker}.py"
          done
          python3 scripts/check_task_lifecycle_contracts.py
          python3 scripts/check_no_runtime_hard_reply.py
          python3 scripts/check_historical_hardcoded_language.py --fail-on-runtime --fail-on-ui-visible
          python3 scripts/check_no_policy_boundary_hard_reply.py
          npm ci --ignore-scripts --prefix UI
          bash scripts/product_identity_tests.sh --with-ui
      - name: Test disk admission, memory failure recovery, background ownership and logs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_rotate_component_log.py -v
          bash component_start/common_tests.sh
          cargo test --locked -p clawd --bin clawd -- --list > "$RUNNER_TEMP/reliability-tests.txt"
          for suite in runtime::storage_pressure::tests runtime::worker_health::tests worker::runtime_support::worker_supervision::tests worker::runtime_support::background_workers::tests memory::jobs::tests memory::jobs::sources::tests memory::job_failure::tests memory::embedding_jobs::tests memory::service::tests memory::wp0_baseline_tests; do
            grep -F "${suite}::" "$RUNNER_TEMP/reliability-tests.txt"
            cargo test --locked -p clawd --bin clawd "$suite" -- --test-threads=3
          done
      - name: Build verified local runtime without publishing any release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p clawd --bin clawd
          npm run build --prefix UI
          artifact_root="$RUNNER_TEMP/runtime-operations-artifact"
          mkdir -p "$artifact_root/runtime"
          install -m 755 target/release/clawd "$artifact_root/runtime/clawd"
          mkdir -p "$artifact_root/runtime/UI"
          cp -R UI/dist "$artifact_root/runtime/UI/dist"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/runtime/source-commit"
          printf '%s\n' 'disk-reserve memory-model-binding typed-failure-recovery supervised-background blocking-no-overlap log-rotation product-identity-two-brand-ui' > "$artifact_root/runtime/verified-gates"
          (cd "$artifact_root/runtime" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf "$artifact_root/runtime-${GITHUB_SHA}.tar.gz" -C "$artifact_root" runtime
          (cd "$artifact_root" && sha256sum "runtime-${GITHUB_SHA}.tar.gz" > "runtime-${GITHUB_SHA}.tar.gz.sha256")
      - name: Attest exact tested Linux runtime
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/runtime-operations-artifact/runtime-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: runtime-operations-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-operations-artifact/*
          if-no-files-found: error
          retention-days: 14

  pi-component:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Prepare cross tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config make perl clang libclang-dev protobuf-compiler
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-aarch64-unknown-linux-gnu
          prefix-key: v1-rust-cargo-profiles
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
            target/aarch64-unknown-linux-gnu/debug
            target/aarch64-unknown-linux-gnu/release
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Compile Pi backend for the same candidate
        run: |
          INSTALL_DEPS=0 bash scripts/archive/cross-build/cross-build-pi.sh --target pi64 --package clawd --no-ui --skip-deps -- --locked
          python3 scripts/verify_release_binary.py target/aarch64-unknown-linux-gnu/release/clawd aarch64-unknown-linux-gnu
