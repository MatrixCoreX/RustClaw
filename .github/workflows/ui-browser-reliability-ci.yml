name: UI and signed browser reliability

"on":
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "UI/**"
      - "desktop/**"
      - "scripts/prepare_macos_ci_browser.py"
      - "scripts/tests/test_prepare_macos_ci_browser.py"
      - "scripts/macos-system-browser.sh"
      - "scripts/tests/test_macos_system_browser.py"
      - ".github/workflows/ui-browser-reliability-ci.yml"
      - ".github/workflows/macos-arm64-release-artifact.yml"
  push:
    branches: [main]
    paths:
      - "UI/**"
      - "desktop/**"
      - "scripts/prepare_macos_ci_browser.py"
      - "scripts/tests/test_prepare_macos_ci_browser.py"
      - "scripts/macos-system-browser.sh"
      - "scripts/tests/test_macos_system_browser.py"
      - ".github/workflows/ui-browser-reliability-ci.yml"
      - ".github/workflows/macos-arm64-release-artifact.yml"

permissions:
  contents: read

jobs:
  ui-and-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require unchanged runtime sources for manual UI-only verification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet origin/main HEAD -- Cargo.toml Cargo.lock .cargo crates optional_skills external_skills configs docker prompts pi_app services; then
            echo '::error::Runtime sources changed; select full verification instead of UI-only mode.'
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install Linux validation tools
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Check browser preparation boundaries
        run: python3 -m unittest discover -s scripts/tests -p test_prepare_macos_ci_browser.py
      - name: Install macOS validation tools
        if: ${{ runner.os == 'macOS' }}
        run: |
          if ! command -v rg >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          fi
      - name: Prepare and verify native signed browser
        if: ${{ runner.os == 'macOS' }}
        run: |
          python3 scripts/prepare_macos_ci_browser.py
          bash scripts/macos-system-browser.sh --resolve-executable
          bash scripts/macos-system-browser.sh --version
          python3 -m unittest discover -s scripts/tests -p test_macos_system_browser.py
      - name: Install locked UI dependencies
        run: npm ci --ignore-scripts --prefix UI
      - name: Test, typecheck and build UI
        run: |
          npm test --prefix UI
          npm run lint --prefix UI
          npm run build --prefix UI
          bash scripts/product_identity_tests.sh --with-ui
      - name: Verify shared desktop UI transport and build
        run: |
          npm ci --ignore-scripts --prefix desktop
          npm run lint --prefix desktop
          npm test --prefix desktop
          npm run build:ui --prefix desktop
          python3 scripts/check_product_identity_coupling.py --self-test
          python3 scripts/check_product_identity_coupling.py
      - name: Stress conversation scope without hiding failures
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          mkdir -p "$RUNNER_TEMP/ui-reliability"
          for attempt in 1 2 3 4 5; do
            if ! (cd UI && node --import tsx --import ./test/product-identity-setup.ts --test src/hooks/useChatRuntime.conversation-input.test.ts) >"$RUNNER_TEMP/ui-reliability/conversation-$attempt.log" 2>&1; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Install browser test runtime
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            node UI/node_modules/playwright/cli.js install --with-deps chromium
          else
            node UI/node_modules/playwright/cli.js install chromium
          fi
      - name: Stress QR scope commits without provider calls
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for attempt in 1 2 3; do
            if ! UI_BROWSER_ARTIFACTS="$RUNNER_TEMP/ui-reliability/qr-$attempt" node UI/test/wechat-login-ownership.browser.mjs; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Retain every stress result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-reliability-${{ matrix.os }}
          path: ${{ runner.temp }}/ui-reliability
          if-no-files-found: ignore
