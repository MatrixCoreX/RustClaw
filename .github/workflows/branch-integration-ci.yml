name: Completed branch integration verification

"on":
  push:
    branches: ["ci/runtime-custody-integration-*", "ci/completed-branches-*", "ci/runtime-priority-optimization-*", "ci/runtime-maintenance-*", "ci/runtime-efficiency-*", "ci/runtime-context-*", "ci/subagent-contracts-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cache: linux-runtime-read
          - os: macos-15-intel
            cache: macos-runtime-read
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"
      APP_PTY_SESSION_RUNNER: ${{ github.workspace }}/target/debug/pty-session-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pkg-config clang libclang-dev protobuf-compiler ripgrep bubblewrap
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf ripgrep
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.cache }}
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Prepare native browser and protocol fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: -r scripts/nl_tests/requirements.txt
          npm ci --ignore-scripts --prefix crates/skills/browser_web
          if [[ "$RUNNER_OS" == Linux ]]; then
            node crates/skills/browser_web/node_modules/playwright/cli.js install --with-deps chromium
          else
            node crates/skills/browser_web/node_modules/playwright/cli.js install chromium
          fi
      - name: Check runtime contracts and product independence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_long_files.py
          python3 scripts/check_cross_platform_contracts.py
          python3 scripts/check_startup_preflight_contract.py
          for checker in product_identity_coupling skill_storage_ownership task_event_archive_contracts task_event_context_team_contracts; do
            python3 "scripts/check_${checker}.py" --self-test
            python3 "scripts/check_${checker}.py"
          done
          python3 scripts/check_task_lifecycle_contracts.py
          python3 scripts/check_no_runtime_hard_reply.py
          python3 scripts/check_historical_hardcoded_language.py --fail-on-runtime --fail-on-ui-visible
          python3 scripts/check_no_policy_boundary_hard_reply.py
          python3 scripts/check_skill_hotplug_coupling_inventory.py --self-test
          python3 scripts/check_skill_hotplug_coupling_inventory.py
          python3 scripts/check_rag_contracts.py --self-test
          python3 scripts/check_rag_contracts.py
          python3 scripts/check_mcp_runtime_contracts.py --self-test
          python3 scripts/check_mcp_runtime_contracts.py
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_answer_verifier_boundary.py
          python3 scripts/check_deterministic_decision_inventory.py
          python3 scripts/check_evidence_extractor_contracts.py --self-test
          python3 scripts/nl_tests/macos_runner_workflow_tests.py
          python3 -m unittest discover -s scripts/tests -p test_memory_project_process_probe.py
          python3 -m unittest discover -s scripts/tests -p test_clean_dev_artifacts.py
          python3 -m unittest discover -s scripts/tests -p test_check_staged_secrets.py
          python3 -m unittest discover -s scripts/tests -p test_runtime_checkpoint.py -v
          python3 -m unittest discover -s scripts/tests -p 'test_runtime_backup*.py' -v
          python3 scripts/nl_tests/check_runtime_regression_budget.py --self-test
          python3 scripts/nl_tests/summarize_rollout_metrics.py --self-test
          python3 -m unittest discover -s scripts/tests -p test_runtime_latency_statistics.py -v
          python3 -m unittest discover -s scripts/tests -p test_deduplicate_task_deliveries.py -v
          python3 -m unittest discover -s scripts/tests -p test_skill_action_doc_sections.py -v
          python3 -m unittest discover -s scripts/tests -p test_deployment_staging_deduplication.py -v
          npm ci --ignore-scripts --prefix UI
          npm run lint --prefix UI
          npm test --prefix UI
          bash scripts/product_identity_tests.sh --with-ui
      - name: Compile shared runtime test executables
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk -p skill-runner -p claw-core -p clawd --no-run
      - name: Build exact native host consumers
        id: native_build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p clawd --bins -p skill-runner --bin skill-runner -p agent-skill-sdk --bin skillctl
      - name: Verify resumable cold chunks and physical SQLite compaction
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clawd --bin task-event-maintenance -- --test-threads=3
          EVENT_MAINTENANCE_BIN="$PWD/target/debug/task-event-maintenance" python3 -m unittest discover -s scripts/tests -p test_event_storage_maintenance.py -v
          python3 -m unittest discover -s scripts/tests -p test_large_db_memory_probe.py -v
      - name: Verify unchanged runtime builds reuse their compiled artifacts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p clawd --bins --message-format=json > "$RUNNER_TEMP/runtime-warm-build.jsonl"
          python3 -c 'import json,sys; rows=[r for line in open(sys.argv[1]) if (r:=json.loads(line)).get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="clawd"]; assert rows and all(r.get("fresh") is True for r in rows), "runtime_warm_build_not_fresh"' "$RUNNER_TEMP/runtime-warm-build.jsonl"
      - name: Verify priority regression boundaries before the full suite
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$APP_PTY_SESSION_RUNNER"
          fixture_root="$(mktemp -d "$RUNNER_TEMP/extension-scaffold-cache.XXXXXX")"
          target/debug/skillctl init rust offline_scaffold_cache "$fixture_root/package"
          cargo fetch --locked --manifest-path "$fixture_root/package/Cargo.toml"
          cargo test --locked -p extension-manager-skill -- --test-threads=1 --nocapture
          result=0
          mkdir -p "$RUNNER_TEMP/focused-regression-logs"
          for prefix in capability_result::write_receipt::tests:: agent_engine::planning::repair_catalog_tests:: agent_engine::observed_output::output_entries::projection_tests:: prompt_projection::capability_results::tests:: agent_engine::planning::native_request::wire_tests:: prompt_utils::template_projection::tests:: prompt_projection::tests:: agent_engine::planning::native_ledger_projection::tests:: agent_engine::planning::native_context_index::tests:: agent_engine::skill_execution::child_task_execution_policy::argument_constraints::literal_constraints::tests:: agent_engine::skill_execution::child_task_execution_policy::argument_constraints::compatibility::tests:: agent_engine::attempt_ledger::tests:: task_context_builder::tests:: repo::child_tasks::terminal_failure::tests:: answer_verifier::answer_verifier_runtime::child_result_evidence::tests:: visible_text::tests:: repo::child_tasks::tests::child_result_budget_origin_comes_from_frozen_contract_not_the_child_answer providers::anthropic_claude::tests:: providers::anthropic_model_turn::tests:: providers::reasoning_control::tests:: providers::openai_compat::tests:: providers::openai_model_turn::tests:: repo::tasks::tests::task_resume_execution_tests::resume_lease:: agent_engine::verification_resume::tests:: finalize::loop_reply::machine_failure::tests:: fallback::tests:: agent_engine::loop_control::loop_control_finalization_gate::tests:: agent_engine::loop_control::loop_control_answer_recovery::child_evidence_tests:: answer_verifier::answer_verifier_runtime::prompt_evidence_blocks::projection_tests:: agent_engine::execution_loop::tests::sequential_execution_future_leaves_stack_space_for_cold_library_initialization agent_engine::arg_resolver::tests:: agent_engine::subagent_runtime::subagent_runtime_persistent::context_tests:: llm_gateway::cancellation_tests:: http::task_attachment_upload::tests:: http::task_query::tests:: task_read_id::tests:: llm_gateway::interrupt::tests:: ui_attachments::upload::tests:: http::task_artifacts::media_guard::tests:: event_json_chunks::tests:: task_budget_contract::model_admission::tests:: http::task_artifacts::tests:: agent_engine::skill_execution::skill_execution_subagent::recovery_tests:: repo::tasks::tests::child_terminal_projection_uses_machine_contract_not_visible_text repo::tasks::tests::parent_child_merge_continues_from_structured_findings_only repo::child_tasks::tests::legacy_success_without_machine_data_cannot_fabricate_a_structured_result_reference finalize::loop_reply::tests::child_machine_fields_keep_their_declared_shape_without_changing_ordinary_json_delivery agent_engine::planning::child_result_handoff_tests:: repo::child_tasks::result_contract::tests:: worker::runtime_support::dispatch_result_tests:: execution_isolation::execution_isolation_patch::tests:: worker::resume_replay_executor::tests:: worker::child_task_execution_scope::tests:: agent_engine::planning::native_capability_tools::argument_value_tests:: finalize::task::task_payload_helpers::rejection_status_tests:: agent_engine::skill_execution::child_task_execution_policy::capability_budget::tests:: agent_engine::subagent_runtime::tests:: finalize::task::tests:: capability_map::tests:: agent_engine::planning::native_tests:: agent_engine::planning::native_respond_repair::tests:: agent_engine::planner_protocol_failure::tests:: repo::child_tasks::budget_accounting_tests:: runtime::host_filesystem::operation_lock::tests:: skills::builtin::builtin_workspace_patch::transaction::attempt::tests:: resource_wait::tests:: task_lifecycle::resource_wait_tests:: capability_result::file_integrity_tests:: agent_engine::skill_action_docs::tests:: agent_engine::capability_catalog::tests:: agent_engine::support::tests:: agent_engine::planning::native_artifact_tests:: agent_engine::planning_prompt::tests:: mcp_runtime::tests::health_tick_reconnects_closed_transport_without_replaying_a_tool memory::generation_review::tests:: memory::ux::retrieval::generation_tests:: agent_engine::planner_skill_context::tests:: http::ui_routes::skill_store_tests:: http::ui_routes::storage_governance_tests:: task_result_objects::tests:: repo::tasks::tests::child_graph::parent_cancel_ repo::child_task_graph:: task_journal_archive::tests:: repo::tasks::tests::journal_archive:: worker::ask_execution_context::tests::rewind_boundary_ repo::tasks::tests::task_resume_execution_tests::terminal_result_projection::result_object_tests:: skills::builtin::builtin_pty_session::tests::; do
            if cargo test --locked -p clawd --bin clawd "$prefix" -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py --prefix "$prefix" &&
               cargo test --locked -p clawd --bin clawd "$prefix" -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/focused-regression-logs/${prefix//::/_}.log"; then
              :
            else
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combined-native-focused-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/focused-regression-logs/*.log
          if-no-files-found: warn
      - name: Verify shared SDK consumers and native runtime
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          result=0
          mkdir -p "$RUNNER_TEMP/full-native-logs"
          cargo test --locked -p agent-skill-sdk 2>&1 | tee "$RUNNER_TEMP/full-native-logs/skill-sdk.log" || result=1
          cargo test --locked -p skill-runner 2>&1 | tee "$RUNNER_TEMP/full-native-logs/skill-runner.log" || result=1
          cargo test --locked -p claw-core 2>&1 | tee "$RUNNER_TEMP/full-native-logs/core.log" || result=1
          cargo test --locked -p clawd --bin clawd -- --test-threads=3 2>&1 | tee "$RUNNER_TEMP/full-native-logs/runtime.log" || result=1
          cargo test --locked -p wechatd 2>&1 | tee "$RUNNER_TEMP/full-native-logs/channel-wechat.log" || result=1
          cargo test --locked -p telegramd 2>&1 | tee "$RUNNER_TEMP/full-native-logs/channel-telegram.log" || result=1
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combined-native-full-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/full-native-logs/*.log
          if-no-files-found: warn
      - name: Verify real memory project startup and restart
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project-process-evidence"
          python3 -B scripts/tests/memory_project_process_probe.py --repository "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" --clawd "$GITHUB_WORKSPACE/target/debug/clawd" --skill-runner "$GITHUB_WORKSPACE/target/debug/skill-runner" --skillctl "$GITHUB_WORKSPACE/target/debug/skillctl" --output "$RUNNER_TEMP/project-process-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combined-project-process-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/project-process-evidence/result.json
            ${{ runner.temp }}/project-process-evidence/*/process-*.log
          if-no-files-found: warn
      - name: Verify the actual process owner and package custody
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export APP_OWNER_ENTRY_TEST_BINARY="$PWD/target/debug/clawd"
          cargo test --locked -p clawd --bin clawd -- --list --ignored > "$RUNNER_TEMP/owner-acceptance-tests.txt"
          for test in local_process_owner::entry::tests::entry_executable_protocol_acceptance local_process_owner::authority_entry::tests::entry_executable_authority_acceptance skills::runner::owner_custody_tests::entry_executable_sdk_custody_acceptance skills::runner::owner_pre_ready_tests::entry_executable_pre_ready_acceptance skills::runner::owner_preparation_tests::entry_executable_ready_abort_acceptance skills::runner::owner_submission_tests::entry_executable_async_submit_acceptance skills::runner::owner_recovery_tests::entry_executable_inventory_recovery_acceptance; do
            grep -Fx "$test: test" "$RUNNER_TEMP/owner-acceptance-tests.txt"
            cargo test --locked -p clawd --bin clawd "$test" -- --exact --ignored --test-threads=1 --nocapture
          done
      - name: Check proactive SDK skill consumers from registry metadata
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --locked --format-version 1 > "$RUNNER_TEMP/workspace-packages.json"
          python3 scripts/skill_store_packages.py --scope proactive --format packages --target host > "$RUNNER_TEMP/proactive-packages.txt"
          python3 -c 'import json,os,pathlib; t=pathlib.Path(os.environ["RUNNER_TEMP"]); allowed=set((t/"proactive-packages.txt").read_text().split()); packages=json.loads((t/"workspace-packages.json").read_text())["packages"]; names=sorted(p["name"] for p in packages if p["name"] in allowed and any(d["name"]=="agent-skill-sdk" for d in p["dependencies"])); (t/"sdk-consumers.txt").write_text("\n".join(names)+"\n"); assert names'
          while IFS= read -r package; do
            cargo check --locked --all-targets -p "$package"
          done < "$RUNNER_TEMP/sdk-consumers.txt"
      - name: Verify the memory gateway transport
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: cargo test --locked -p webd
      - name: Package exact native test components without publishing a release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p webd --bin webd
          npm run build --prefix UI
          artifact_root="$RUNNER_TEMP/runtime-operations-artifact"
          mkdir -p "$artifact_root/runtime"
          install -m 755 target/debug/clawd target/debug/task-event-maintenance "$artifact_root/runtime/"
          install -m 755 target/debug/skill-runner target/debug/skillctl target/debug/webd "$artifact_root/runtime/"
          mkdir -p "$artifact_root/runtime/UI"
          cp -R UI/dist "$artifact_root/runtime/UI/dist"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/runtime/source-commit"
          printf '%s\n' debug > "$artifact_root/runtime/build-profile"
          printf '%s\n' 'file-delivery-revisions memory-model-binding memory-import durable-memory-response process-custody workspace-recovery disk-reserve supervised-background product-identity-two-brand-ui' > "$artifact_root/runtime/verified-gates"
          (cd "$artifact_root/runtime" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf "$artifact_root/runtime-${GITHUB_SHA}.tar.gz" -C "$artifact_root" runtime
          (cd "$artifact_root" && sha256sum "runtime-${GITHUB_SHA}.tar.gz" > "runtime-${GITHUB_SHA}.tar.gz.sha256")
      - name: Attest exact tested Linux runtime
        if: runner.os == 'Linux'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/runtime-operations-artifact/runtime-${{ github.sha }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: branch-integration-test-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-operations-artifact/*
          if-no-files-found: error
          retention-days: 14

  pi-component:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Prepare cross tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config make perl clang libclang-dev protobuf-compiler
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-aarch64-unknown-linux-gnu
          prefix-key: v1-rust-cargo-profiles
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
            target/aarch64-unknown-linux-gnu/debug
            target/aarch64-unknown-linux-gnu/release
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Compile Pi backend for the same candidate
        run: |
          INSTALL_DEPS=0 bash scripts/archive/cross-build/cross-build-pi.sh --target pi64 --package clawd --no-ui --skip-deps -- --locked
          python3 scripts/verify_release_binary.py target/aarch64-unknown-linux-gnu/release/clawd aarch64-unknown-linux-gnu
