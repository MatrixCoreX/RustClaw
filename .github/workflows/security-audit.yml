name: Security Audit

"on":
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "optional_skills/**/Cargo.toml"
      - UI/package.json
      - UI/package-lock.json
      - .github/workflows/security-audit.yml
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "optional_skills/**/Cargo.toml"
      - UI/package.json
      - UI/package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: Rust dependency audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable GitHub Action references
        run: python3 scripts/check_github_action_pins.py
      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: UI dependency audit
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: UI
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
