        with:
          name: verified-linux-runtime-read-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-read-artifact/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
      - name: Build exact Linux STT consumers and verified skill receipt
        run: |
          set -euo pipefail
          cargo build --locked --release -p skill-runner --bin skill-runner -p audio-transcribe-skill --bin audio-transcribe-skill -p agent-skill-sdk --bin skillctl
          artifact_root="$RUNNER_TEMP/runtime-stt-artifact"
