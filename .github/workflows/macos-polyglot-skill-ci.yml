          python3 scripts/project_skill_receipts.py --skill audio_transcribe --sdk-cli "$PWD/target/release/skillctl" --package-root "$artifact_root/runtime-stt/packages"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/runtime-stt/source-commit"
          printf '%s\n' 'stt_full_suite selected_connection_environment selected_connection_host_ownership sdk_and_runner receipt_protocol_smoke receipt_publication_metadata receipt_regular_file_reads artifact_regular_file_reads' > "$artifact_root/runtime-stt/verified-gates"
          (cd "$artifact_root/runtime-stt" && find bin packages -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$artifact_root/runtime-stt" && sha256sum source-commit verified-gates >> SHA256SUMS)
          tar -czf "$artifact_root/runtime-stt-${GITHUB_SHA}.tar.gz" -C "$artifact_root" runtime-stt
          (cd "$artifact_root" && sha256sum "runtime-stt-${GITHUB_SHA}.tar.gz" > "runtime-stt-${GITHUB_SHA}.tar.gz.sha256")
      - name: Attest exact Linux STT consumers and skill package
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: ${{ runner.temp }}/runtime-stt-artifact/runtime-stt-${{ github.sha }}.tar.gz
      - name: Preserve exact verified Linux STT consumers and skill package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux-runtime-stt-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-stt-artifact/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
  media-session-portability:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    uses: ./.github/workflows/media-session-portability-ci.yml

  ui-browser-reliability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'ui' }}
    uses: ./.github/workflows/ui-browser-reliability-ci.yml

  # Mixed changes need UI feedback in parallel with all existing native gates.
  # A green UI job alone never authorizes a mixed runtime/UI deployment.
  full-ui-browser-reliability:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    uses: ./.github/workflows/ui-browser-reliability-ci.yml
    with:
      full_runtime_validation: true

  polyglot-skill-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Resolver, installer, and process supervision
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Install native protocol compiler
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Reuse successful Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-runtime-tests
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Test SDK regular artifact digest reads
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::artifact_read_tests -- --test-threads=16 --nocapture
      - name: Test SDK regular metadata reads
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::read_tests -- --test-threads=16 --nocapture
          cargo test --locked -p agent-skill-sdk metadata_file::tests -- --test-threads=16 --nocapture
      - name: Test SDK receipt publication metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::publication_tests -- --test-threads=16 --nocapture
          cargo test --locked -p agent-skill-sdk --lib --no-run --message-format=json > "$RUNNER_TEMP/sdk-publication-tests.json"
          python3 scripts/tests/run_privileged_secure_fs_case.py "$RUNNER_TEMP/sdk-publication-tests.json" --sdk-publication
      - name: Test dedicated STT credentials and selected connection ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_skill_manifests_tests.py
          python3 scripts/sync_skill_manifests.py --check
          cargo test --locked -p claw-core llm_connection_environment::tests -- --test-threads=1 --nocapture
          cargo test --locked -p audio-transcribe-skill -- --test-threads=16 --nocapture

      - name: Validate manifest and build inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_polyglot_skill_contracts.py --self-test
          python3 scripts/check_polyglot_skill_contracts.py --require-all
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_cross_platform_contracts.py
          python3 -m unittest discover -s scripts/tests -p 'test_release_native_libraries.py'
          python3 -m unittest discover -s scripts/tests -p 'test_clean_dev_artifacts.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_managed_files.py'

      - name: Test AiAPP private session fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix optional_skills/media_discovery
          "${pythonLocation:?setup-python root missing}/bin/python3" -m unittest discover -s optional_skills/media_download/tests
          node --test optional_skills/media_discovery/test/account_sessions.test.mjs

      - name: Test retained-task acceptance without resubmission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement scripts/nl_tests/requirements.txt
          bash -n scripts/nl_tests/run_manual_test.sh
          python3 scripts/nl_tests/manual_case_observation_tests.py
          python3 scripts/nl_tests/manual_case_lifecycle_tests.py
          python3 scripts/nl_tests/coding_observation_chain_tests.py
          python3 scripts/nl_tests/manual_capability_assertions_tests.py
          python3 scripts/nl_tests/expectation_directives_tests.py
          python3 scripts/nl_tests/video_speech_acceptance_tests.py
          python3 scripts/nl_tests/authenticated_probe_http_tests.py
          python3 scripts/nl_tests/auth_key_http_tests.py
          python3 scripts/nl_tests/release_candidate_workflow_tests.py
          python3 scripts/nl_tests/macos_runner_workflow_tests.py
          python3 scripts/nl_tests/concurrent_health_probe_tests.py
          python3 scripts/nl_tests/probe_runtime_read_latency_tests.py
          python3 scripts/nl_tests/replay_verifier_candidate_tests.py

      - name: Test SDK and runner
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-skill-sdk
          cargo test -p skill-runner

      - name: Test AiAPP account controls and private session isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clawd --bin clawd selected_connection_tests -- --test-threads=1 --nocapture
          cargo test --locked -p claw-core llm_provider_descriptors::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_gateway::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=1 --nocapture
          for attempt in 1 2 3 4 5; do
            cargo test --locked -p claw-core model_catalog::tests -- --test-threads=16
          done
