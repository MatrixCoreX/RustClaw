        run: |
          set -euo pipefail
          cargo test -p claw-core -p wechatd -p telegramd -p feishud -p larkd -p whatsappd
          npm ci --ignore-scripts --prefix services/wa-web-bridge
          npm test --prefix services/wa-web-bridge

      - name: Check shared runtime integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace

      - name: Test native immutable evidence publication
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd secure_workspace_fs::tests
          cargo test -p clawd --bin clawd skill_output_artifact::evidence_storage::tests

      - name: Test verifier journal projections
        shell: bash
        run: cargo test -p clawd --bin clawd verify_projection_tests

      - name: Test answer verification and structured selectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p clawd --bin clawd answer_verifier -- --test-threads=1
          cargo test --locked -p clawd --bin clawd machine_selector -- --test-threads=1
          cargo test --locked -p clawd --bin clawd planning_output_contract -- --test-threads=1
          cargo test --locked -p clawd --bin clawd prepare_round -- --test-threads=1
          cargo test --locked -p clawd --bin clawd task_contract -- --test-threads=1
          cargo test --locked -p clawd --bin clawd pipeline_types -- --test-threads=1
          cargo test --locked -p clawd --bin clawd task_journal -- --test-threads=1
          "${pythonLocation:?setup-python root missing}/bin/python3" scripts/nl_tests/output_contract_schema_tests.py

      - name: Test channel registration response ownership
        shell: bash
        run: cargo test -p clawd --bin clawd channel_registration_race_tests -- --test-threads=1 --nocapture

      - name: Test channel configuration authorization, privacy and ordering
        shell: bash
        run: cargo test -p clawd --bin clawd channel_configuration -- --test-threads=1 --nocapture

      - name: Test durable channel registration authority
        shell: bash
        run: cargo test -p clawd --bin clawd repo::channel_registration::tests -- --test-threads=1 --nocapture

      - name: Test durable process target and async poll boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd local_process_job::tests -- --test-threads=1 --nocapture
          cargo test -p clawd --bin clawd worker::async_poll_executor::tests -- --test-threads=1 --nocapture

      - name: Test capability loading and verification-only recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd capability_map -- --test-threads=2
          cargo test -p clawd --bin clawd capability_discovery -- --test-threads=2
          cargo test -p clawd --bin clawd verification -- --test-threads=2

      - name: Test OpenAI-compatible text and native streaming
        shell: bash
        run: cargo test -p clawd --bin clawd providers::openai_ -- --test-threads=2

      - name: Test exact-endpoint provider transport
        shell: bash
        run: cargo test -p clawd --bin clawd providers::client::transport_tests -- --test-threads=2

      - name: Test model control-plane authorization
        shell: bash
        run: cargo test -p clawd --bin clawd model_control_plane_tests -- --test-threads=2

      - name: Test health read responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd health_runtime_tests -- --test-threads=2

      - name: Test host summary responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd host_system_ -- --nocapture --test-threads=1

      - name: Test model transport diagnostic credential isolation
        shell: bash
        run: cargo test -p clawd --bin clawd gemini_transport_error_tests -- --test-threads=2

      - name: Test resolved connection-probe credentials
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd llm_credentials -- --test-threads=2
          cargo test -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=2

      - name: Test quota termination and recoverable provider waits
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd quota -- --test-threads=2
          cargo test -p clawd --bin clawd model_blocker_checkpoint -- --test-threads=2

      - name: Test literal command execution and boundary hints
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd run_cmd_literal -- --test-threads=2
          cargo test -p clawd --bin clawd explicit_machine_command -- --test-threads=2

      - name: Test canonical terminal evidence coverage and privacy
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd observed_output::output_entries::history_tests -- --test-threads=2
          cargo test -p clawd --bin clawd capability_result_synthesis::tests -- --test-threads=2

      - name: Precompile native Skill Store packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/precompile_skill_store.sh host

      - name: Upload native Skill Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillctl-store-macos-${{ runner.arch }}
          path: target/prebuilt-skill-packages/*
          if-no-files-found: error
