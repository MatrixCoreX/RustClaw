      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - ".github/workflows/ubuntu-x86_64-release.yml"
      - ".github/workflows/pi-aarch64-release.yml"
      - ".github/workflows/macos-arm64-release-artifact.yml"
      - ".github/workflows/desktop-native.yml"
      - ".github/workflows/media-session-portability-ci.yml"
      - ".github/workflows/rust-cache-profile-ci.yml"
      - ".github/workflows/security-audit.yml"
      - "scripts/report_rust_dependency_audit.py"
      - "scripts/tests/test_rust_dependency_audit.py"
      - "scripts/build_macos_media_tools.sh"
      - "scripts/bundle_macos_skill_dependencies.py"
      - "scripts/tests/test_release_macos_media_tools.py"
      - "scripts/tests/test_release_build_cache.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "UI/**"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawcli/**"
      - "crates/wechatd/**"
      - "crates/telegramd/**"
      - "crates/feishud/**"
      - "crates/larkd/**"
      - "crates/whatsappd/**"
      - "services/wa-web-bridge/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "package-release.sh"
      - "scripts/stage_release_pi_app.py"
      - "scripts/verify_release_binary.py"
      - "scripts/tests/test_release_native_libraries.py"
      - "deploy-github-release.sh"
      - "scripts/tests/test_release_managed_files.py"
      - "scripts/auth-key.sh"
      - "scripts/nl_tests/auth_key_http_tests.py"
      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: "all retains the full runtime gate; ui runs focused UI/native-browser checks without rebuilding unchanged Rust."
        type: choice
        default: all
        options: [all, ui]

permissions:
  contents: read

jobs:
  skill-sdk-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Linux immutable package repair and runner
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Prepare the sandbox backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-sdk-integrity
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test SDK repair, pinning, rollback and runner
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk
          cargo test --locked -p skill-runner
          cargo build --locked -p agent-skill-sdk --bin skillctl
      - name: Preserve the exact tested CLI for isolated artifact verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux-skillctl-${{ github.sha }}
          path: target/debug/skillctl
          if-no-files-found: error
          retention-days: 7

  runtime-read-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Linux indexed history reads and verified core
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "2"
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Prepare native build and sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap pkg-config clang libclang-dev protobuf-compiler ripgrep
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-runtime-read
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test dedicated STT credentials and selected connection ownership
        run: |
          set -euo pipefail
          cargo test --locked -p audio-transcribe-skill -- --test-threads=16 --nocapture
      - name: Prepare existing runtime verification helpers
        run: |
          cargo build --locked -p agent-skill-sdk --bin skillctl
          cargo build --locked -p skill-runner
      - name: Verify Linux indexed history reads and startup upgrades
        run: |
          set -euo pipefail
          python3 scripts/check_long_files.py
          python3 scripts/check_cross_platform_contracts.py
          python3 scripts/check_product_identity_coupling.py --self-test
          python3 scripts/check_product_identity_coupling.py
          python3 scripts/check_skill_storage_ownership.py --self-test
          python3 scripts/check_skill_storage_ownership.py
          python3 scripts/check_aipp_decoupling.py --self-test
          python3 scripts/check_aipp_decoupling.py
          python3 scripts/check_historical_hardcoded_language.py --fail-on-runtime --fail-on-ui-visible
          python3 scripts/check_task_lifecycle_contracts.py
          cargo test --locked -p claw-core llm_provider_descriptors::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_gateway::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=1 --nocapture
          for attempt in 1 2 3 4 5; do
            cargo test --locked -p claw-core model_catalog::tests -- --test-threads=16
          done
          cargo test --locked -p clawd --bin clawd task_event_transport -- --test-threads=1
          cargo test --locked -p clawd --bin clawd auth_contract_tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd model_catalog -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_debug_trace_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_model_selection -- --test-threads=1 --nocapture
          cargo test --locked -p clawcli commands::models_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd model_settings_integrity_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_read_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd secure_workspace_fs -- --test-threads=1 --nocapture
          python3 scripts/tests/test_privileged_secure_fs_case.py
          cargo test --locked -p clawd --bin clawd --no-run --message-format=json > "$RUNNER_TEMP/secure-fs-test-artifacts.jsonl"
          python3 scripts/tests/run_privileged_secure_fs_case.py "$RUNNER_TEMP/secure-fs-test-artifacts.jsonl"
          cargo test --locked -p clawd --bin clawd aipp -- --test-threads=1
          cargo test --locked -p clawd --bin clawd run_skill -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_admission::tests::state_mutations -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_admission::tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_switch_update_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_reload_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd runtime_config_write_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_credentials_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_write_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_files::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd channel_registration_race_tests::application_tests -- --test-threads=1 --nocapture
          cargo test --locked -p claw-core secrets::model_environment::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd provider_credential_tests -- --test-threads=1 --nocapture
      - name: Verify both product identities with the shared UI
        run: |
          npm ci --ignore-scripts --prefix UI
          bash scripts/product_identity_tests.sh --with-ui
      - name: Build the exact verified Linux core without publishing a release
        run: |
          set -euo pipefail
          cargo build --locked --release -p clawd --bin clawd -p clawcli --bin clawcli
          artifact_root="$RUNNER_TEMP/runtime-read-artifact"
          mkdir -p "$artifact_root/runtime-read"
          install -m 755 target/release/clawd "$artifact_root/runtime-read/clawd"
          install -m 755 target/release/clawcli "$artifact_root/runtime-read/clawcli"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_root/runtime-read/source-commit"
          printf '%s\n' 'task_event_transport_and_archive ui_auth_error_contract model_catalog_fixture_isolation model_catalog_read model_settings_integrity secure_workspace_metadata configuration_reads skill_state_mutations skill_switch_updates skill_reload_publication configuration_publication provider_credentials aipp aipp_read_surfaces aipp_generation run_skill product_identity storage_ownership aipp_decoupling cross_platform task_lifecycle model_catalog_truthfulness task_model_selection cli_model_readiness provider_descriptors' > "$artifact_root/runtime-read/verified-gates"
          (cd "$artifact_root/runtime-read" && sha256sum clawd clawcli source-commit verified-gates > SHA256SUMS)
          tar -czf "$artifact_root/runtime-read-${GITHUB_SHA}.tar.gz" -C "$artifact_root" runtime-read
          (cd "$artifact_root" && sha256sum "runtime-read-${GITHUB_SHA}.tar.gz" > "runtime-read-${GITHUB_SHA}.tar.gz.sha256")
      - name: Attest the exact Linux core provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ runner.temp }}/runtime-read-artifact/runtime-read-${{ github.sha }}.tar.gz
      - name: Preserve the exact verified Linux core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux-runtime-read-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-read-artifact/*.tar.gz*
          if-no-files-found: error
          retention-days: 7
  media-session-portability:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    uses: ./.github/workflows/media-session-portability-ci.yml

  ui-browser-reliability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_scope == 'ui' }}
    uses: ./.github/workflows/ui-browser-reliability-ci.yml

  # Mixed changes need UI feedback in parallel with all existing native gates.
  # A green UI job alone never authorizes a mixed runtime/UI deployment.
  full-ui-browser-reliability:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    uses: ./.github/workflows/ui-browser-reliability-ci.yml
    with:
      full_runtime_validation: true

  polyglot-skill-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Resolver, installer, and process supervision
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Install native protocol compiler
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Reuse successful Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: macos-runtime-tests
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Test dedicated STT credentials and selected connection ownership
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p audio-transcribe-skill -- --test-threads=16 --nocapture

      - name: Validate manifest and build inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_polyglot_skill_contracts.py --self-test
          python3 scripts/check_polyglot_skill_contracts.py --require-all
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_cross_platform_contracts.py
          python3 -m unittest discover -s scripts/tests -p 'test_release_native_libraries.py'
          python3 -m unittest discover -s scripts/tests -p 'test_clean_dev_artifacts.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_managed_files.py'

      - name: Test AiAPP private session fixtures
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix optional_skills/media_discovery
          "${pythonLocation:?setup-python root missing}/bin/python3" -m unittest discover -s optional_skills/media_download/tests
          node --test optional_skills/media_discovery/test/account_sessions.test.mjs

      - name: Test retained-task acceptance without resubmission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement scripts/nl_tests/requirements.txt
          bash -n scripts/nl_tests/run_manual_test.sh
          python3 scripts/nl_tests/manual_case_observation_tests.py
          python3 scripts/nl_tests/manual_case_lifecycle_tests.py
          python3 scripts/nl_tests/coding_observation_chain_tests.py
          python3 scripts/nl_tests/manual_capability_assertions_tests.py
          python3 scripts/nl_tests/expectation_directives_tests.py
          python3 scripts/nl_tests/video_speech_acceptance_tests.py
          python3 scripts/nl_tests/authenticated_probe_http_tests.py
          python3 scripts/nl_tests/auth_key_http_tests.py
          python3 scripts/nl_tests/release_candidate_workflow_tests.py
          python3 scripts/nl_tests/macos_runner_workflow_tests.py
          python3 scripts/nl_tests/concurrent_health_probe_tests.py
          python3 scripts/nl_tests/probe_runtime_read_latency_tests.py
          python3 scripts/nl_tests/replay_verifier_candidate_tests.py

      - name: Test SDK and runner
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-skill-sdk
          cargo test -p skill-runner

      - name: Test AiAPP account controls and private session isolation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p claw-core llm_provider_descriptors::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_gateway::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=1 --nocapture
          for attempt in 1 2 3 4 5; do
            cargo test --locked -p claw-core model_catalog::tests -- --test-threads=16
          done
          cargo test --locked -p clawd --bin clawd task_event_transport -- --test-threads=1
          cargo test --locked -p clawd --bin clawd auth_contract_tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd model_catalog -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_debug_trace_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_model_selection -- --test-threads=1 --nocapture
          cargo test --locked -p clawcli commands::models_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd model_settings_integrity_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_read_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd secure_workspace_fs -- --test-threads=1 --nocapture
          python3 scripts/tests/test_privileged_secure_fs_case.py
          cargo test --locked -p clawd --bin clawd aipp -- --test-threads=1
          cargo test --locked -p clawd --bin clawd run_skill -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_admission::tests::state_mutations -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_admission::tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_switch_update_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_reload_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd runtime_config_write_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_credentials_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_write_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_files::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd channel_registration_race_tests::application_tests -- --test-threads=1 --nocapture
          cargo test --locked -p claw-core secrets::model_environment::tests -- --test-threads=1 --nocapture
