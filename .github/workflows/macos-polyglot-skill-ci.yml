      - ".github/workflows/pi-aarch64-release.yml"
      - ".github/workflows/macos-arm64-release-artifact.yml"
      - ".github/workflows/desktop-native.yml"
      - ".github/workflows/media-session-portability-ci.yml"
      - ".github/workflows/rust-cache-profile-ci.yml"
      - ".github/workflows/security-audit.yml"
      - "scripts/report_rust_dependency_audit.py"
      - "scripts/tests/test_rust_dependency_audit.py"
      - "scripts/build_macos_media_tools.sh"
      - "scripts/bundle_macos_skill_dependencies.py"
      - "scripts/tests/test_release_macos_media_tools.py"
      - "scripts/tests/test_release_build_cache.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "UI/**"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawcli/**"
      - "crates/wechatd/**"
      - "crates/telegramd/**"
      - "crates/feishud/**"
      - "crates/larkd/**"
      - "crates/whatsappd/**"
      - "services/wa-web-bridge/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "package-release.sh"
      - "scripts/stage_release_pi_app.py"
      - "scripts/verify_release_binary.py"
      - "scripts/tests/test_release_native_libraries.py"
      - "scripts/tests/run_privileged_secure_fs_case.py"
      - "scripts/tests/test_privileged_secure_fs_case.py"
      - "deploy-github-release.sh"
      - "scripts/tests/test_release_managed_files.py"
      - "scripts/auth-key.sh"
      - "scripts/nl_tests/auth_key_http_tests.py"
      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - ".github/workflows/ubuntu-x86_64-release.yml"
      - ".github/workflows/pi-aarch64-release.yml"
      - ".github/workflows/macos-arm64-release-artifact.yml"
      - ".github/workflows/desktop-native.yml"
      - ".github/workflows/media-session-portability-ci.yml"
      - ".github/workflows/rust-cache-profile-ci.yml"
      - ".github/workflows/security-audit.yml"
      - "scripts/report_rust_dependency_audit.py"
      - "scripts/tests/test_rust_dependency_audit.py"
      - "scripts/build_macos_media_tools.sh"
      - "scripts/bundle_macos_skill_dependencies.py"
      - "scripts/tests/test_release_macos_media_tools.py"
      - "scripts/tests/test_release_build_cache.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "UI/**"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawcli/**"
      - "crates/wechatd/**"
      - "crates/telegramd/**"
      - "crates/feishud/**"
      - "crates/larkd/**"
      - "crates/whatsappd/**"
      - "services/wa-web-bridge/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "package-release.sh"
      - "scripts/stage_release_pi_app.py"
      - "scripts/verify_release_binary.py"
      - "scripts/tests/test_release_native_libraries.py"
      - "deploy-github-release.sh"
      - "scripts/tests/test_release_managed_files.py"
      - "scripts/auth-key.sh"
      - "scripts/nl_tests/auth_key_http_tests.py"
      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  workflow_dispatch:
    inputs:
      verification_scope:
        description: "all retains the full runtime gate; ui runs focused UI/native-browser checks without rebuilding unchanged Rust."
        type: choice
        default: all
        options: [all, ui]

permissions:
  contents: read

jobs:
  skill-sdk-metadata-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Windows regular metadata descriptor reads
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: windows-sdk-metadata
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST"
          cache-targets: "false"
          cache-directories: target/debug
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test native Windows metadata handles and regular-file links
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk --lib metadata_file::tests -- --test-threads=4 --nocapture
      - name: Test native Windows artifact digest targets and source links
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk --lib receipt::artifact_read_tests -- --test-threads=4 --nocapture
  skill-sdk-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Linux immutable package repair and runner
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Prepare the sandbox backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-sdk-integrity
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test SDK repair, pinning, rollback and runner
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk
          cargo test --locked -p skill-runner
          cargo build --locked -p agent-skill-sdk --bin skillctl
      - name: Preserve the exact tested CLI for isolated artifact verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux-skillctl-${{ github.sha }}
          path: target/debug/skillctl
          if-no-files-found: error
          retention-days: 7

  runtime-read-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'ui' }}
    name: Linux indexed history reads and verified core
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: "2"
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.23.x"
      - name: Prepare native build and sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap pkg-config clang libclang-dev protobuf-compiler ripgrep
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: linux-runtime-read
          prefix-key: v1-rust-cargo-profiles
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT"
          cache-targets: "false"
          cache-directories: |
            target/debug
            target/release
          cache-bin: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Test SDK regular artifact digest reads
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::artifact_read_tests -- --test-threads=16 --nocapture
      - name: Test SDK regular metadata reads
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::read_tests -- --test-threads=16 --nocapture
          cargo test --locked -p agent-skill-sdk metadata_file::tests -- --test-threads=16 --nocapture
      - name: Test SDK receipt publication metadata
        run: |
          set -euo pipefail
          cargo test --locked -p agent-skill-sdk receipt::publication_tests -- --test-threads=16 --nocapture
          cargo test --locked -p agent-skill-sdk --lib --no-run --message-format=json > "$RUNNER_TEMP/sdk-publication-tests.json"
          python3 scripts/tests/run_privileged_secure_fs_case.py "$RUNNER_TEMP/sdk-publication-tests.json" --sdk-publication
      - name: Test dedicated STT credentials and selected connection ownership
        run: |
          set -euo pipefail
          python3 scripts/sync_skill_manifests_tests.py
          python3 scripts/sync_skill_manifests.py --check
          cargo test --locked -p claw-core llm_connection_environment::tests -- --test-threads=1 --nocapture
          cargo test --locked -p audio-transcribe-skill -- --test-threads=16 --nocapture
      - name: Prepare existing runtime verification helpers
        run: |
          cargo build --locked -p agent-skill-sdk --bin skillctl
          cargo build --locked -p skill-runner
      - name: Verify Linux indexed history reads and startup upgrades
        run: |
          set -euo pipefail
          python3 scripts/check_long_files.py
          python3 scripts/check_cross_platform_contracts.py
          python3 scripts/check_product_identity_coupling.py --self-test
          python3 scripts/check_product_identity_coupling.py
          python3 scripts/check_skill_storage_ownership.py --self-test
          python3 scripts/check_skill_storage_ownership.py
          python3 scripts/check_aipp_decoupling.py --self-test
          python3 scripts/check_aipp_decoupling.py
          python3 scripts/check_historical_hardcoded_language.py --fail-on-runtime --fail-on-ui-visible
          python3 scripts/check_task_lifecycle_contracts.py
          cargo test --locked -p clawd --bin clawd selected_connection_tests -- --test-threads=1 --nocapture
          cargo test --locked -p claw-core llm_provider_descriptors::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_gateway::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=1 --nocapture
          for attempt in 1 2 3 4 5; do
            cargo test --locked -p claw-core model_catalog::tests -- --test-threads=16
          done
          cargo test --locked -p clawd --bin clawd task_event_transport -- --test-threads=1
          cargo test --locked -p clawd --bin clawd auth_contract_tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd model_catalog -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_debug_trace_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd task_model_selection -- --test-threads=1 --nocapture
          cargo test --locked -p clawcli commands::models_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd model_settings_integrity_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_read_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd secure_workspace_fs -- --test-threads=1 --nocapture
          python3 scripts/tests/test_privileged_secure_fs_case.py
          cargo test --locked -p clawd --bin clawd --no-run --message-format=json > "$RUNNER_TEMP/secure-fs-test-artifacts.jsonl"
          python3 scripts/tests/run_privileged_secure_fs_case.py "$RUNNER_TEMP/secure-fs-test-artifacts.jsonl"
          cargo test --locked -p clawd --bin clawd aipp -- --test-threads=1
          cargo test --locked -p clawd --bin clawd run_skill -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_admission::tests::state_mutations -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_admission::tests -- --test-threads=1
          cargo test --locked -p clawd --bin clawd skill_switch_update_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd skill_reload_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd runtime_config_write_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd llm_credentials_ -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_write_tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd configuration_files::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd channel_registration_race_tests::application_tests -- --test-threads=1 --nocapture
          cargo test --locked -p claw-core secrets::model_environment::tests -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd provider_credential_tests -- --test-threads=1 --nocapture
      - name: Test stable principal lifecycle and fresh identity revocation
        run: |
          set -euo pipefail
          cargo test --locked -p clawd --bin clawd identity_lifecycle -- --test-threads=1 --nocapture
          cargo test --locked -p clawd --bin clawd repo::auth:: -- --test-threads=1 --nocapture --skip identity_lifecycle
          cargo test --locked -p clawd --bin clawd principal_ownership -- --test-threads=1 --nocapture
      - name: Test feedback mutation atomicity without hiding failures
        run: |
          set -euo pipefail
          python3 scripts/tests/assert_rust_test_selection.py --self-test
          cargo test --locked -p clawd --bin clawd memory::ux::feedback_tests:: -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py \
            --prefix memory::ux::feedback_tests:: \
            --require failures::incorrect_without_content_does_not_commit_feedback \
            --require failures::blank_correction_does_not_commit_feedback \
            --require failures::unsupported_correction_does_not_commit_feedback \
            --require failures::replacement_insert_failure_rolls_back_feedback_and_supersession \
            --require failures::revision_insert_failure_rolls_back_feedback_and_replacement \
            --require failures::recall_disable_failure_rolls_back_feedback \
            --require failures::feedback_insert_failure_cannot_publish_a_correction \
            --require success::fact_correction_commits_feedback_replacement_and_reversible_revision_together \
            --require success::preference_correction_preserves_feedback_and_existing_revision_contract \
            --require success::irrelevant_feedback_records_each_event_without_mutating_content \
            --require success::do_not_use_commits_feedback_and_existing_recall_disable_result \
            --require success::stale_revision_is_rejected_without_feedback_or_mutation \
            --require success::another_principals_memory_cannot_receive_feedback \
            --require success::nonexistent_memory_cannot_receive_feedback \
            --require success::read_only_connection_cannot_partially_record_feedback
          cargo test --locked -p clawd --bin clawd memory::ux::feedback_tests:: -- --test-threads=1 --nocapture
      - name: Test projection transactions without losing parent ownership
        run: |
          set -euo pipefail
          python3 scripts/tests/assert_rust_test_selection.py --self-test
          cargo test --locked -p clawd --bin clawd memory::projection_transaction::tests:: -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py \
            --prefix memory::projection_transaction::tests:: \
            --require standalone_failure_rolls_back_and_releases_the_writer \
            --require nested_failure_caught_by_parent_rolls_back_only_its_local_effects \
            --require nested_success_does_not_commit_its_parent_transaction \
            --require nested_panic_restores_local_state_without_ending_the_parent
          cargo test --locked -p clawd --bin clawd memory::projection_transaction::tests:: -- --test-threads=1 --nocapture
      - name: Test recall mutation indexes without hiding failures
        run: |
          set -euo pipefail
          python3 scripts/tests/assert_rust_test_selection.py --self-test
          cargo test --locked -p clawd --bin clawd memory::ux::recall_contract_tests:: -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py \
            --prefix memory::ux::recall_contract_tests:: \
            --require corrections::fact_correction_replaces_index_and_fts_without_retaining_old_content \
            --require corrections::preference_correction_replaces_index_and_fts_and_preserves_other_owners \
            --require corrections::fact_correction_undo_restores_only_original_retrieval \
            --require disabling::fact_do_not_use_removes_index_and_fts_and_survives_rebuild \
            --require disabling::preference_do_not_use_survives_rebuild_and_preserves_other_owners \
            --require disabling::recent_do_not_use_survives_rebuild_without_deleting_transcript \
            --require corrections::failed_replacement_index_insert_rolls_back_canonical_revision_and_feedback \
            --require corrections::stale_correction_preserves_all_owners_indexes_and_canonical_rows \
            --require disabling::rebuilding_cannot_reenable_a_preference_disabled_by_explicit_feedback \
            --require disabling::rebuilding_cannot_reenable_a_transcript_disabled_by_explicit_feedback \
            --require incremental::incremental_preference_indexing_does_not_reenable_explicitly_disabled_content \
            --require incremental::incremental_transcript_indexing_does_not_reenable_explicitly_disabled_content \
            --require incremental::incremental_fact_indexing_does_not_reenable_explicitly_disabled_content \
            --require boundaries::missing_feedback_ledger_rejects_index_refresh_without_effects_or_read_repair \
            --require boundaries::failed_fts_insert_rolls_back_feedback_canonical_revision_and_projection \
            --require boundaries::absent_optional_fts_does_not_block_correction_or_initialize_a_table \
            --require boundaries::correcting_preference_preserves_another_scope_of_the_same_principal \
            --require boundaries::rotating_admin_credential_does_not_make_owned_canonical_facts_uncorrectable \
            --require boundaries::rebuild_after_credential_rotation_preserves_every_owned_canonical_kind \
            --require incremental::stale_incremental_preference_payload_cannot_overwrite_a_confirmed_correction \
            --require derived::disabled_fact_retires_queued_embeddings \
            --require derived::disabled_preference_retires_queued_embeddings \
            --require derived::disabled_transcript_retires_queued_embeddings \
            --require derived::disabled_fact_deactivates_previously_completed_vectors \
            --require derived::disabled_preference_deactivates_previously_completed_vectors \
            --require derived::disabled_transcript_deactivates_previously_completed_vectors \
            --require derived::corrected_fact_retires_its_old_completed_vectors \
            --require derived::corrected_preference_retires_its_old_completed_vectors \
            --require derived::suppression_keeps_another_owners_completed_vectors_and_pending_work \
            --require derived::missing_index_source_cannot_produce_a_new_active_vector
          cargo test --locked -p clawd --bin clawd memory::ux::recall_contract_tests:: -- --test-threads=1 --nocapture
      - name: Test inflight embedding recall and lease fences
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/assert_rust_test_selection.py --self-test
          cargo test --locked -p clawd --bin clawd memory::embedding_jobs::capacity_http_tests::recall_races:: -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py \
            --prefix memory::embedding_jobs::capacity_http_tests::recall_races:: \
            --require recall_suppression_after_request_cannot_reactivate_a_late_vector \
            --require canonical_deletion_after_request_cannot_create_an_active_orphan_vector \
            --require canonical_correction_after_request_cannot_commit_an_obsolete_vector \
            --require remote_consent_revocation_after_request_cannot_commit_a_late_vector \
            --require replacing_a_worker_lease_after_request_prevents_the_old_vector_commit \
            --require projection_digest_change_after_request_prevents_a_stale_vector_commit \
            --require unchanged_inflight_source_and_lease_still_commit_once \
            --require another_owners_suppression_does_not_discard_the_current_response
          cargo test --locked -p clawd --bin clawd memory::embedding_jobs::capacity_http_tests::recall_races:: -- --test-threads=1 --nocapture
      - name: Test embedding response publication and recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/assert_rust_test_selection.py --self-test
          cargo test --locked -p clawd --bin clawd memory::embedding_jobs::capacity_http_tests::response_commit:: -- --list --color never | python3 scripts/tests/assert_rust_test_selection.py \
            --prefix memory::embedding_jobs::capacity_http_tests::response_commit:: \
            --require failed_ack_rolls_back_vector_and_recovers_response_without_another_provider_call \
            --require received_response_is_discarded_if_consent_is_revoked_before_recovery \
            --require a_live_replacement_lease_cannot_be_consumed_by_response_recovery \
