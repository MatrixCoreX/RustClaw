name: Polyglot Skill macOS CI

"on":
  pull_request:
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - ".github/workflows/ubuntu-x86_64-release.yml"
      - ".github/workflows/pi-aarch64-release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "UI/**"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawcli/**"
      - "crates/wechatd/**"
      - "crates/telegramd/**"
      - "crates/feishud/**"
      - "crates/larkd/**"
      - "crates/whatsappd/**"
      - "services/wa-web-bridge/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "package-release.sh"
      - "scripts/stage_release_pi_app.py"
      - "scripts/verify_release_binary.py"
      - "scripts/tests/test_release_native_libraries.py"
      - "deploy-github-release.sh"
      - "scripts/tests/test_release_managed_files.py"
      - "scripts/auth-key.sh"
      - "scripts/nl_tests/auth_key_http_tests.py"
      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - ".github/workflows/ubuntu-x86_64-release.yml"
      - ".github/workflows/pi-aarch64-release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "UI/**"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawcli/**"
      - "crates/wechatd/**"
      - "crates/telegramd/**"
      - "crates/feishud/**"
      - "crates/larkd/**"
      - "crates/whatsappd/**"
      - "services/wa-web-bridge/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "package-release.sh"
      - "scripts/stage_release_pi_app.py"
      - "scripts/verify_release_binary.py"
      - "scripts/tests/test_release_native_libraries.py"
      - "deploy-github-release.sh"
      - "scripts/tests/test_release_managed_files.py"
      - "scripts/auth-key.sh"
      - "scripts/nl_tests/auth_key_http_tests.py"
      - "scripts/nl_tests/release_candidate_workflow_tests.py"
      - "scripts/nl_tests/macos_runner_workflow_tests.py"
      - "scripts/skill_store_packages.py"
      - "scripts/nl_tests/run_manual_test.sh"
      - "scripts/nl_tests/manual_case_observation*.py"
      - "scripts/nl_tests/manual_*assertions*.py"
      - "scripts/nl_tests/expectation_directives*.py"
      - "scripts/nl_tests/coding_observation_chain*.py"
      - "scripts/nl_tests/audit_multilang_coding_restart*.py"
      - "scripts/nl_tests/*probe*.py"
      - "scripts/nl_tests/run_live_instruction_steering_suite.py"
      - "scripts/nl_tests/configure_isolated_nl_memory.py"
      - "scripts/nl_tests/replay_verifier_candidate*.py"
      - "scripts/nl_tests/requirements.txt"
      - "scripts/nl_tests/video_speech_acceptance_tests.py"
      - "scripts/nl_tests/cases/nl_cases_video_speech_positive_20261030.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polyglot-skill-macos:
    name: Resolver, installer, and process supervision
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Install native protocol compiler
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          protoc --version

      - name: Cache Cargo registry and git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate manifest and build inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_polyglot_skill_contracts.py --self-test
          python3 scripts/check_polyglot_skill_contracts.py --require-all
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_cross_platform_contracts.py
          python3 -m unittest discover -s scripts/tests -p 'test_release_native_libraries.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_managed_files.py'

      - name: Test retained-task acceptance without resubmission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement scripts/nl_tests/requirements.txt
          bash -n scripts/nl_tests/run_manual_test.sh
          python3 scripts/nl_tests/manual_case_observation_tests.py
          python3 scripts/nl_tests/manual_case_lifecycle_tests.py
          python3 scripts/nl_tests/coding_observation_chain_tests.py
          python3 scripts/nl_tests/manual_capability_assertions_tests.py
          python3 scripts/nl_tests/expectation_directives_tests.py
          python3 scripts/nl_tests/video_speech_acceptance_tests.py
          python3 scripts/nl_tests/authenticated_probe_http_tests.py
          python3 scripts/nl_tests/auth_key_http_tests.py
          python3 scripts/nl_tests/release_candidate_workflow_tests.py
          python3 scripts/nl_tests/macos_runner_workflow_tests.py
          python3 scripts/nl_tests/concurrent_health_probe_tests.py
          python3 scripts/nl_tests/probe_runtime_read_latency_tests.py
          python3 scripts/nl_tests/replay_verifier_candidate_tests.py

      - name: Test SDK and runner
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-skill-sdk
          cargo test -p skill-runner

      - name: Test browser API authentication boundaries
        shell: bash
        env:
          UI_BROWSER_ARTIFACTS: ${{ runner.temp }}/ui-authentication-browser-tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix UI
          npm test --prefix UI
          npm run lint --prefix UI
          node UI/node_modules/playwright/cli.js install chromium
          node UI/test/runtime-api-transport.browser.mjs
          node UI/test/authentication-ownership.browser.mjs
          node UI/test/authentication-concurrency.browser.mjs
          node UI/test/system-host-ownership.browser.mjs
          node UI/test/system-admin-ownership.browser.mjs
          node UI/test/system-action-ownership.browser.mjs
          node UI/test/service-action-ownership.browser.mjs
          node UI/test/channel-service-app.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/channel-config" node UI/test/channel-config-ownership.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/wechat-login" node UI/test/wechat-login-ownership.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/whatsapp-login" node UI/test/whatsapp-login-ownership.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/whatsapp-app" node UI/test/whatsapp-login-app.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/channel-bind" node UI/test/channel-bind-ownership.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/channel-bind-polling" node UI/test/channel-bind-polling.browser.mjs
          UI_BROWSER_ARTIFACTS="$UI_BROWSER_ARTIFACTS/channel-bind-app" node UI/test/channel-bind-app.browser.mjs

      - name: Upload browser authentication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-authentication-browser-evidence
          path: ${{ runner.temp }}/ui-authentication-browser-tests
          if-no-files-found: ignore

      - name: Test CLI transport and task continuity
        shell: bash
        run: cargo test -p clawcli

      - name: Test channel core transport and delivery
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p claw-core -p wechatd -p telegramd -p feishud -p larkd -p whatsappd
          npm ci --ignore-scripts --prefix services/wa-web-bridge
          npm test --prefix services/wa-web-bridge

      - name: Check shared runtime integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace

      - name: Test native immutable evidence publication
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd secure_workspace_fs::tests
          cargo test -p clawd --bin clawd skill_output_artifact::evidence_storage::tests

      - name: Test verifier journal projections
        shell: bash
        run: cargo test -p clawd --bin clawd verify_projection_tests

      - name: Test channel registration response ownership
        shell: bash
        run: cargo test -p clawd --bin clawd channel_registration_race_tests -- --test-threads=1 --nocapture

      - name: Test channel configuration authorization, privacy and ordering
        shell: bash
        run: cargo test -p clawd --bin clawd channel_configuration -- --test-threads=1 --nocapture

      - name: Test durable channel registration authority
        shell: bash
        run: cargo test -p clawd --bin clawd repo::channel_registration::tests -- --test-threads=1 --nocapture

      - name: Test capability loading and verification-only recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd capability_map -- --test-threads=2
          cargo test -p clawd --bin clawd capability_discovery -- --test-threads=2
          cargo test -p clawd --bin clawd verification -- --test-threads=2

      - name: Test OpenAI-compatible text and native streaming
        shell: bash
        run: cargo test -p clawd --bin clawd providers::openai_ -- --test-threads=2

      - name: Test exact-endpoint provider transport
        shell: bash
        run: cargo test -p clawd --bin clawd providers::client::transport_tests -- --test-threads=2

      - name: Test model control-plane authorization
        shell: bash
        run: cargo test -p clawd --bin clawd model_control_plane_tests -- --test-threads=2

      - name: Test health read responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd health_runtime_tests -- --test-threads=2

      - name: Test host summary responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd host_system_ -- --nocapture --test-threads=1

      - name: Test model transport diagnostic credential isolation
        shell: bash
        run: cargo test -p clawd --bin clawd gemini_transport_error_tests -- --test-threads=2

      - name: Test resolved connection-probe credentials
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd llm_credentials -- --test-threads=2
          cargo test -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=2

      - name: Test quota termination and recoverable provider waits
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd quota -- --test-threads=2
          cargo test -p clawd --bin clawd model_blocker_checkpoint -- --test-threads=2

      - name: Test literal command execution and boundary hints
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd run_cmd_literal -- --test-threads=2
          cargo test -p clawd --bin clawd explicit_machine_command -- --test-threads=2

      - name: Test canonical terminal evidence coverage and privacy
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd observed_output::output_entries::history_tests -- --test-threads=2
          cargo test -p clawd --bin clawd capability_result_synthesis::tests -- --test-threads=2

      - name: Precompile native Skill Store packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/precompile_skill_store.sh host

      - name: Upload native Skill Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillctl-store-macos-${{ runner.arch }}
          path: target/prebuilt-skill-packages/*
          if-no-files-found: error
