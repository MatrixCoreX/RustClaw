        run: cargo test -p clawd --bin clawd providers::openai_ -- --test-threads=2

      - name: Test exact-endpoint provider transport
        shell: bash
        run: cargo test -p clawd --bin clawd providers::client::transport_tests -- --test-threads=2

      - name: Test model control-plane authorization
        shell: bash
        run: cargo test -p clawd --bin clawd model_control_plane_tests -- --test-threads=2

      - name: Test health read responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd health_runtime_tests -- --test-threads=2

      - name: Test host summary responsiveness and authorization
        shell: bash
        run: cargo test -p clawd --bin clawd host_system_ -- --nocapture --test-threads=1

      - name: Test model transport diagnostic credential isolation
        shell: bash
        run: cargo test -p clawd --bin clawd gemini_transport_error_tests -- --test-threads=2

      - name: Test resolved connection-probe credentials
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd llm_credentials -- --test-threads=2
          cargo test -p clawd --bin clawd llm_provider_runtime_tests -- --test-threads=2

      - name: Test quota termination and recoverable provider waits
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd quota -- --test-threads=2
          cargo test -p clawd --bin clawd model_blocker_checkpoint -- --test-threads=2

      - name: Test literal command execution and boundary hints
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd run_cmd_literal -- --test-threads=2
          cargo test -p clawd --bin clawd explicit_machine_command -- --test-threads=2

      - name: Test canonical terminal evidence coverage and privacy
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p clawd --bin clawd observed_output::output_entries::history_tests -- --test-threads=2
          cargo test -p clawd --bin clawd capability_result_synthesis::tests -- --test-threads=2

      - name: Precompile native Skill Store packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/precompile_skill_store.sh host

      - name: Upload native Skill Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillctl-store-macos-${{ runner.arch }}
          path: target/prebuilt-skill-packages/*
          if-no-files-found: error
