name: Polyglot Skill macOS CI

"on":
  pull_request:
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**/skill.toml"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "scripts/skill_store_packages.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-polyglot-skill-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "configs/skills_registry.toml"
      - "crates/claw-core/**"
      - "crates/clawd/**"
      - "crates/skill-runner/**"
      - "crates/skill-sdk/**"
      - "crates/skills/**/skill.toml"
      - "docs/schemas/**"
      - "optional_skills/**"
      - "scripts/check_on_demand_skill_builds.py"
      - "scripts/check_polyglot_skill_contracts.py"
      - "scripts/precompile_skill_store.sh"
      - "scripts/project_skill_receipts.py"
      - "scripts/skill_store_packages.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polyglot-skill-macos:
    name: Resolver, installer, and process supervision
    runs-on: macos-14
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      APP_REQUIRE_REFERENCE_ADAPTERS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"

      - name: Cache Cargo registry and git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate manifest and build inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_polyglot_skill_contracts.py --self-test
          python3 scripts/check_polyglot_skill_contracts.py --require-all
          python3 scripts/check_on_demand_skill_builds.py
          python3 scripts/check_cross_platform_contracts.py

      - name: Test SDK and runner
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agent-skill-sdk
          cargo test -p skill-runner

      - name: Check shared runtime integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p claw-core -p clawd -p skill-runner

      - name: Precompile native Skill Store packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/precompile_skill_store.sh host

      - name: Upload native Skill Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillctl-store-macos-${{ runner.arch }}
          path: target/prebuilt-skill-packages/*
          if-no-files-found: error
