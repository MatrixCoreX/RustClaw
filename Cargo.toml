[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"
authors = ["Agent System Contributors"]
repository = ""

[patch.crates-io]
# feishud long_connection: receive raw event payload to tolerate null fields (open-lark strong types fail)
open-lark = { path = "patches/open-lark" }

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
config = "0.15"
hmac = "0.12"
hex = "0.4"
ignore = "0.4.31"
globset = "0.4.19"
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
portable-pty = "0.9"
regex = "1"
quick-xml = "0.37"
# 使用 rustls 替代 native-tls，交叉编译 aarch64 时无需目标平台 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rmcp = { version = "2.2.0", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
# bundled：从源码编译 SQLite，交叉编译 aarch64 时无需目标平台 libsqlite3
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
# default-features = false + rustls 便于交叉编译 aarch64（无需 OpenSSL）
teloxide = { version = "0.12", default-features = false, features = ["rustls", "ctrlc_handler", "webhooks-axum"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
wait-timeout = "0.2"

# Full debug symbols make the clawd test binary hundreds of MiB and cause slow,
# memory-heavy links on developer laptops. Level 1 keeps line information for
# useful backtraces while making iterative development materially lighter.
[profile.dev]
debug = 1

[profile.test]
debug = 1
