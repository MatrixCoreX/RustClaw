limit_req_zone $binary_remote_addr zone=llm_relay_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=llm_relay_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name llm.matrixai.one;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm.matrixai.one;

    ssl_certificate /etc/letsencrypt/live/llm.matrixai.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.matrixai.one/privkey.pem;

    client_max_body_size 2m;

    location /health {
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /v1/ {
        limit_req zone=llm_relay_api burst=10 nodelay;
        limit_conn llm_relay_conn 4;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
