limit_req_zone $binary_remote_addr zone=llm_relay_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=llm_relay_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name llm.matrixai.one;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm.matrixai.one;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/llm.matrixai.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.matrixai.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    client_max_body_size 2m;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8796;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ^~ /health/ {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location /v1/ {
        limit_except GET POST { deny all; }
        limit_req zone=llm_relay_api burst=10 nodelay;
        limit_conn llm_relay_conn 4;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
