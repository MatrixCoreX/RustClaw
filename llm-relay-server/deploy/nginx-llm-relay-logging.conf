# Installed in the nginx http context as /etc/nginx/conf.d/31-llm-relay-security-logging.conf.
# Do not add request arguments, cookies, authorization headers, or request bodies.
log_format llm_relay_origin escape=json
    '{"ts":"$time_iso8601","request_id":"$request_id","host":"$host",'
    '"remote_addr":"$remote_addr","origin_peer":"$realip_remote_addr",'
    '"origin_client_verify":"$ssl_client_verify","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_time":$request_time}';
