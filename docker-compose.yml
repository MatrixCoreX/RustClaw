name: agent-system

services:
  agent-system:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agent-system
    environment:
      RUST_LOG: warn
      APP_PROFILE: release
    ports:
      - "8788:8788"
    restart: unless-stopped
    volumes:
      - agent-system-data:/app/data
      - agent-system-logs:/app/logs
      - ./audio:/app/audio
      - ./document:/app/document
      - ./image:/app/image
      - ./docker/config:/app/docker/config
      - ./prompts:/app/prompts
      - ./third_party:/app/third_party

volumes:
  agent-system-data:
    name: agent-system-data
  agent-system-logs:
    name: agent-system-logs
