schema_version = 1

# These fixtures freeze the former failure boundary before migration. A case
# changes to `migrated_success` only together with an executable regression
# test proving the target behavior.

[[cases]]
id = "productive_model_call_41"
limit_id = "HL-01"
trigger = 41
legacy_state = "migrated_success"
source_path = "crates/clawd/src/llm_gateway.rs"
legacy_symbol = "DEFAULT_MAX_LLM_CALLS_PER_TASK"
expected_after = "continues_until_unified_task_budget_decision"
test_command = "cargo test -p clawd task_budget_contract_tests::productive_model_turn_41_continues_and_checkpoint_restore_keeps_consumption"

