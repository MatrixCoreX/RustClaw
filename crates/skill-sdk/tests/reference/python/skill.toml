schema_version = 1

[package]
name = "reference_python"
version = "1.0.0"
description = "Cross-language reference conformance fixture"
protocol = "rustclaw-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "MIT"

[registry]
name = "reference_python"
capability_policy_source = "registry"

[build]
adapter = "python"
source_root = "python"
lockfile = "requirements.lock"
network = "deny"

[run]
launcher = "python"
entrypoint = "runtime/src/main.py"
working_directory = "."
timeout_seconds = 10
smoke_args = { action = "calculate", a = 1, b = 2 }

[security]
capability_policy_source = "registry"
sandbox = "required"
runtime_network = false
inherit_credentials = false

[storage]
kind = "none"
schema_version = 1
migration_owner = "reference_python"

[lifecycle]
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"
