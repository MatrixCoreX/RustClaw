schema_version = 1

[package]
name = "smoke_ping_demo"
version = "0.1.0"
description = "Return a structured pong response for protocol and registration smoke tests."
protocol = "rustclaw-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "MIT"
source = "external_skills/smoke_ping_demo"

[registry]
name = "smoke_ping_demo"
capability_policy_source = "registry"

[build]
adapter = "cargo"
source_root = "external_skills/smoke_ping_demo"
package = "smoke-ping-demo-skill"
binary = "smoke-ping-demo-skill"
lockfile = "Cargo.lock"
network = "deny"
lifecycle_scripts = false

[run]
launcher = "native"
entrypoint = "runtime/bin/smoke-ping-demo-skill"
working_directory = "."
timeout_seconds = 15
environment_allowlist = []
smoke_args = { action = "ping" }

[security]
capability_policy_source = "registry"
sandbox = "required"
runtime_network = false
inherit_credentials = false

[storage]
kind = "none"
schema_version = 1
migration_owner = "smoke_ping_demo"

[lifecycle]
config_files = []
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"
