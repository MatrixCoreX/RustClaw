schema_version = 2

[package]
name = "smoke_ping_demo"
version = "0.1.0"
description = "Return a structured pong response for protocol and registration smoke tests."
protocol = "rustclaw-jsonl-v1"
supported_os = ["linux", "macos"]
supported_arch = ["x86_64", "aarch64"]
license = "MIT"
source = "external_skills/smoke_ping_demo"

[registry]
name = "smoke_ping_demo"
capability_policy_source = "registry"

[build]
adapter = "cargo"
source_root = "external_skills/smoke_ping_demo"
package = "smoke-ping-demo-skill"
binary = "smoke-ping-demo-skill"
lockfile = "Cargo.lock"
network = "deny"
lifecycle_scripts = false

[run]
launcher = "native"
entrypoint = "runtime/bin/smoke-ping-demo-skill"
working_directory = "."
timeout_seconds = 15
environment_allowlist = []
smoke_args = { action = "ping" }

[security]
capability_policy_source = "registry"
sandbox = "required"
runtime_network = false
inherit_credentials = false

[storage]
kind = "none"
schema_version = 1
migration_owner = "smoke_ping_demo"

[lifecycle]
config_files = []
preserve_data_on_uninstall = true
update_strategy = "atomic_replace"

[capability_request]
schema_version = 1
input_schema = { type = "object", properties = { action = { type = "string", enum = ["ping"] } } }
output_schema = { type = "object", properties = { schema_version = { type = "integer" }, source_skill = { type = "string" }, status = { type = "string" }, message_key = { type = "string" } } }
config_entry_points = []
capabilities = [{ name = "smoke_ping_demo.ping", action = "ping", effect = "observe", execution_mode = "sync_short", required = [], optional = [], timeout_seconds = 15 }]

[capability_request.permissions]
llm_gateway = false
network = false
filesystem_read = false
filesystem_write = false
subprocess = false
package_install = false
privilege_escalation = false
external_publish = false
credential_refs = []

[capability_request.artifact_contract]
kinds = []
output_fields = []

[capability_request.evidence_contract]
required = true
selectors = ["extra.message_key"]
